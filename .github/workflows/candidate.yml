name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character current main HEAD
        required: true
        type: string
      upstream_run_id:
        description: Successful six-cell run selected by release-policy.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: minicon-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upstream_attempt: ${{ steps.identity.outputs.upstream_attempt }}
      upstream_artifact: ${{ steps.identity.outputs.upstream_artifact }}
      payload_artifact: ${{ steps.identity.outputs.payload_artifact }}
      aggregate_artifact: ${{ steps.identity.outputs.aggregate_artifact }}
      signing_mode: ${{ steps.identity.outputs.signing_mode }}
      include_com: ${{ steps.identity.outputs.include_com }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Bind exact main source, policy and successful six-cell run
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]]
          version="$(jq -r .version release-policy.json)"
          signing_mode="$(jq -r .signing.mode release-policy.json)"
          include_com="$(jq -r .assets.minicon_com release-policy.json)"
          [[ "$(jq -r .schema release-policy.json)" == 1 ]]
          [[ "$signing_mode" == off || "$signing_mode" == required ]]
          if [[ "$signing_mode" == required ]]; then
            [[ "$include_com" == true ]]
            expected_workflow=.github/workflows/company-signing.yml
            upstream_artifact=trusted-signed-minicon
            payload_artifact=trusted-signed-minicon
            aggregate_artifact=signed-aggregate-attempt
          else
            expected_workflow=.github/workflows/minicon-com.yml
            upstream_artifact=minicon-com
            payload_artifact=minicon-native-payloads
            aggregate_artifact=minicon-com-aggregate-attempt
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          [[ "$(jq -r .path <<<"$run")" == "$expected_workflow" ]]
          [[ "$(jq -r .event <<<"$run")" == "workflow_dispatch" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$run")" == "$SOURCE_SHA" ]]
          if [[ "$signing_mode" == required ]]; then
            rm -rf signed-preflight
            gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name trusted-signed-minicon --dir signed-preflight
            jq -e '.release_eligible == true' signed-preflight/signing-receipt.json >/dev/null
          fi
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          [[ "$version" == "$cargo_version" ]]
          {
            echo "upstream_attempt=$(jq -r .run_attempt <<<"$run")"
            echo "upstream_artifact=$upstream_artifact"
            echo "payload_artifact=$payload_artifact"
            echo "aggregate_artifact=$aggregate_artifact"
            echo "signing_mode=$signing_mode"
            echo "include_com=$include_com"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  packages:
    needs: preflight
    name: package ${{ matrix.platform_id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform_id: windows-x86_64, runner: ubuntu-24.04, cell: win-x86_64, binary: minicon.exe}
          - {platform_id: windows-arm64, runner: ubuntu-24.04, cell: win-aarch64, binary: minicon.exe}
          - {platform_id: linux-x86_64, runner: ubuntu-24.04, cell: lnx-x86_64, binary: minicon}
          - {platform_id: linux-arm64, runner: ubuntu-24.04, cell: lnx-aarch64, binary: minicon}
          - {platform_id: macos-universal, runner: macos-15, cell: universal, binary: minicon}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download six payloads from the policy-selected exact run
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          PAYLOAD_ARTIFACT: ${{ needs.preflight.outputs.payload_artifact }}
        run: |
          set -euo pipefail
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PAYLOAD_ARTIFACT" --dir upstream

      - name: Verify payload identity and stage package binary
        shell: bash
        run: |
          set -euo pipefail
          receipt=upstream/build-receipt.json
          verify_cell() {
            cell="$1"; path="$2"
            case "$cell" in
              win-x86_64|win-aarch64)
                if [[ -f upstream/signing-receipt.json ]]; then
                  expected="$(jq -r --arg cell "$cell" '.assets[$cell].after_sha256' upstream/signing-receipt.json)"
                else
                  expected="$(jq -r --arg cell "$cell" '.payloads[$cell].sha256' "$receipt")"
                fi
                ;;
              *) expected="$(jq -r --arg cell "$cell" '.payloads[$cell].sha256' "$receipt")" ;;
            esac
            if command -v sha256sum >/dev/null; then
              actual="$(sha256sum "$path" | cut -d' ' -f1)"
            else
              actual="$(shasum -a 256 "$path" | cut -d' ' -f1)"
            fi
            [[ "$actual" == "$expected" ]]
          }
          mkdir -p package-bin
          case '${{ matrix.platform_id }}' in
            macos-universal)
              arm=upstream/cells/osx-aarch64/minicon
              intel=upstream/cells/osx-x86_64/minicon
              verify_cell osx-aarch64 "$arm"
              verify_cell osx-x86_64 "$intel"
              lipo -create -output package-bin/minicon "$arm" "$intel"
              [[ "$(lipo -archs package-bin/minicon)" == *arm64* ]]
              [[ "$(lipo -archs package-bin/minicon)" == *x86_64* ]]
              ;;
            *)
              cell='${{ matrix.cell }}'
              source="upstream/cells/$cell/${{ matrix.binary }}"
              verify_cell "$cell" "$source"
              cp "$source" package-bin/'${{ matrix.binary }}'
              ;;
          esac
          case '${{ matrix.platform_id }}' in
            windows-*) ;;
            *) chmod 0755 package-bin/minicon ;;
          esac

      - name: Archive exact package bytes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          platform='${{ matrix.platform_id }}'
          binary='package-bin/${{ matrix.binary }}'
          name="minicon-$version-$platform"
          mkdir -p "dist/$name"
          cp "$binary" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp scripts/probe-imports.ps1 "dist/$name/" 2>/dev/null || true
          cd dist
          if [[ "$platform" == windows-* ]]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" >"$archive.sha256"
          else
            shasum -a 256 "$archive" >"$archive.sha256"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-package-${{ matrix.platform_id }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  verify-packages:
    needs: [preflight, packages]
    name: execute package ${{ matrix.cell }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: win-x86_64, platform_id: windows-x86_64, runner: windows-2025, family: windows}
          - {cell: win-aarch64, platform_id: windows-arm64, runner: windows-11-arm, family: windows}
          - {cell: lnx-x86_64, platform_id: linux-x86_64, runner: ubuntu-24.04, family: unix}
          - {cell: lnx-aarch64, platform_id: linux-arm64, runner: ubuntu-24.04-arm, family: unix}
          - {cell: osx-x86_64, platform_id: macos-universal, runner: macos-15-intel, family: unix}
          - {cell: osx-aarch64, platform_id: macos-universal, runner: macos-15, family: unix}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-package-${{ matrix.platform_id }}
          path: incoming
      - name: Rehash and execute packaged Windows binary
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ needs.preflight.outputs.version }}'
          $platform = '${{ matrix.platform_id }}'
          $archive = Join-Path $PWD "incoming/minicon-$version-$platform.zip"
          $expected = ((Get-Content -LiteralPath "$archive.sha256" -Raw) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "archive digest mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath unpacked
          $binary = Join-Path $PWD "unpacked/minicon-$version-$platform/minicon.exe"
          $out = Join-Path $env:RUNNER_TEMP "minicon-version.out"
          $err = Join-Path $env:RUNNER_TEMP "minicon-version.err"
          $p = Start-Process -FilePath $binary -ArgumentList '--version' -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          if ($p.ExitCode -ne 0) { throw "packaged PE exit $($p.ExitCode)" }
          if ((Get-Content -LiteralPath $out -Raw).Trim() -ne "minicon $version") { throw "version mismatch" }

      - name: Rehash and execute packaged Unix binary
        if: matrix.family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          platform='${{ matrix.platform_id }}'
          archive="incoming/minicon-$version-$platform.tar.gz"
          expected="$(cut -d' ' -f1 <"$archive.sha256")"
          if command -v sha256sum >/dev/null; then
            actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          fi
          [[ "$actual" == "$expected" ]]
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          binary="unpacked/minicon-$version-$platform/minicon"
          chmod +x "$binary"
          [[ "$("$binary" --version)" == "minicon $version" ]]
          "$binary" --status
          if [[ "$platform" == linux-* ]]; then
            scripts/linux-x11-package-smoke.sh "$binary"
          fi

  seal:
    needs: [preflight, packages, verify-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-package-*
          path: payload
          merge-multiple: true
      - name: Download policy-selected exact bytes and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          UPSTREAM_ATTEMPT: ${{ needs.preflight.outputs.upstream_attempt }}
          UPSTREAM_ARTIFACT: ${{ needs.preflight.outputs.upstream_artifact }}
          AGGREGATE_ARTIFACT: ${{ needs.preflight.outputs.aggregate_artifact }}
          INCLUDE_COM: ${{ needs.preflight.outputs.include_com }}
        run: |
          set -euo pipefail
          mkdir upstream
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$UPSTREAM_ARTIFACT" --dir upstream/source
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$AGGREGATE_ARTIFACT-$UPSTREAM_ATTEMPT" --dir upstream/aggregate
          if [[ "$INCLUDE_COM" == true ]]; then
            cp upstream/source/minicon.com upstream/source/minicon.com.sha256 payload/
          fi
          cp upstream/source/build-receipt.json upstream/build-receipt.json
          cp upstream/source/g3/receipt.json upstream/g3-receipt.json
          if [[ -f upstream/source/signing-receipt.json ]]; then
            cp upstream/source/signing-receipt.json upstream/signing-receipt.json
          fi
          aggregate="$(find upstream/aggregate -maxdepth 1 -name '*aggregate-receipt.json' -print -quit)"
          test -n "$aggregate"
          cp "$aggregate" upstream/aggregate-receipt.json

      - name: Seal exact six-cell release set
        run: |
          set -euo pipefail
          signing_args=()
          if [[ '${{ needs.preflight.outputs.signing_mode }}' == required ]]; then
            python3 research/minicon-com-loader/signing_receipt.py \
              --receipt upstream/signing-receipt.json --root upstream/source
            signing_args=(--signing-receipt upstream/signing-receipt.json)
          fi
          python3 research/minicon-com-loader/candidate_bundle.py seal \
            --payload payload \
            --build-receipt upstream/build-receipt.json \
            --aggregate-receipt upstream/aggregate-receipt.json \
            "${signing_args[@]}" \
            --g3-receipt upstream/g3-receipt.json \
            --policy release-policy.json \
            --source-sha '${{ inputs.source_sha }}' \
            --version '${{ needs.preflight.outputs.version }}' \
            --candidate-run-id "$GITHUB_RUN_ID" \
            --candidate-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output candidate-manifest.json
          python3 research/minicon-com-loader/candidate_bundle.py verify \
            --manifest candidate-manifest.json --payload payload --policy release-policy.json
          mkdir sealed
          cp -R payload sealed/payload
          cp candidate-manifest.json sealed/
          cp upstream/build-receipt.json sealed/
          cp upstream/aggregate-receipt.json sealed/
          cp upstream/g3-receipt.json sealed/
          cp release-policy.json sealed/
          if [[ -f upstream/signing-receipt.json ]]; then cp upstream/signing-receipt.json sealed/; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: sealed/
          if-no-files-found: error
          retention-days: 14
