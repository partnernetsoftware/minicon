name: Trusted Signing Court

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character current main HEAD
        required: true
        type: string
      minicon_com_run_id:
        description: Successful unsigned one-pack/six-cell run for source_sha
        required: true
        type: string
      qualification_only:
        description: Sign and execute exact bytes for provider qualification; never Candidate-eligible
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: minicon-trusted-signing-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      upstream_attempt: ${{ steps.identity.outputs.upstream_attempt }}
      version: ${{ steps.identity.outputs.version }}
      release_eligible: ${{ steps.identity.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Bind exact source and unsigned one-pack run
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha is not a 40-char sha: $SOURCE_SHA" >&2; exit 1; }
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "minicon_com_run_id is not a positive integer: $UPSTREAM_RUN_ID" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "checked-out HEAD does not match source_sha" >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]] || { echo "GITHUB_SHA does not match source_sha" >&2; exit 1; }
          git fetch --no-tags origin main
          # Product source tree only, not raw HEAD equality -- see
          # scripts/product-source-hash.sh. A workflow/doc-only fix landing on
          # main after the Candidate sealed must not force a version bump.
          [[ "$(scripts/product-source-hash.sh origin/main)" == "$(scripts/product-source-hash.sh "$SOURCE_SHA")" ]] || { echo "product source tree at origin/main has drifted from source_sha" >&2; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          [[ "$(jq -r .path <<<"$run")" == ".github/workflows/minicon-com.yml" ]] || { echo "minicon_com_run_id is not a minicon-com.yml run" >&2; exit 1; }
          [[ "$(jq -r .event <<<"$run")" == "workflow_dispatch" ]] || { echo "minicon_com_run_id was not triggered by workflow_dispatch" >&2; exit 1; }
          [[ "$(jq -r .status <<<"$run")" == "completed" ]] || { echo "minicon_com_run_id has not completed" >&2; exit 1; }
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]] || { echo "minicon_com_run_id did not conclude successfully" >&2; exit 1; }
          [[ "$(jq -r .head_sha <<<"$run")" == "$SOURCE_SHA" ]] || { echo "minicon_com_run_id's head_sha does not match source_sha" >&2; exit 1; }
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          [[ "$(jq -r .schema release-policy.json)" == 1 ]] || { echo "release-policy.json schema is not 1" >&2; exit 1; }
          [[ "$(jq -r .version release-policy.json)" == "$version" ]] || { echo "release-policy.json version does not match Cargo.toml" >&2; exit 1; }
          [[ "$(jq -r .assets.rust_coms release-policy.json)" == true ]] || { echo "release-policy.json assets.rust_coms is not true" >&2; exit 1; }
          signing_mode="$(jq -r .signing.mode release-policy.json)"
          [[ "$signing_mode" == off || "$signing_mode" == required ]] || { echo "release-policy.json signing.mode is neither off nor required: $signing_mode" >&2; exit 1; }
          if [[ "$QUALIFICATION_ONLY" == true ]]; then
            release_eligible=false
          else
            [[ "$signing_mode" == required ]] || { echo "release-eligible signing requires signing.mode == required" >&2; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "v$version already exists; release-eligible signing requires an unpublished version" >&2
              exit 1
            fi
            release_eligible=true
          fi
          {
            echo "upstream_attempt=$(jq -r .run_attempt <<<"$run")"
            echo "version=$version"
            echo "release_eligible=$release_eligible"
          } >>"$GITHUB_OUTPUT"

  sign:
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 75
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      signed_com_sha256: ${{ steps.receipt.outputs.signed_com_sha256 }}
      signed_com_arm64_sha256: ${{ steps.receipt.outputs.signed_com_arm64_sha256 }}
      source_tree_digest: ${{ steps.receipt.outputs.source_tree_digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Download exact unsigned artifacts and aggregate receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          UPSTREAM_ATTEMPT: ${{ needs.preflight.outputs.upstream_attempt }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:UPSTREAM_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name minicon-com --dir upstream/com
          gh run download $env:UPSTREAM_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name minicon-native-payloads --dir upstream/native
          gh run download $env:UPSTREAM_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name "minicon-com-aggregate-attempt-$env:UPSTREAM_ATTEMPT" --dir upstream/aggregate

      - name: Verify unsigned identity and stage exact signing set
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          UPSTREAM_ATTEMPT: ${{ needs.preflight.outputs.upstream_attempt }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content upstream/com/build-receipt.json -Raw | ConvertFrom-Json
          $aggregate = Get-Content upstream/aggregate/aggregate-receipt.json -Raw | ConvertFrom-Json
          if ($build.source_sha -ne $env:SOURCE_SHA -or $build.source_dirty -ne $false) { throw 'unsigned build identity mismatch' }
          if ($build.product_version -ne $env:EXPECTED_VERSION) { throw 'unsigned build version mismatch' }
          # v0.2.27: the signable single-file artifacts are the per-cell Rust
          # .com launchers (win-x86_64 + win-aarch64), each an MSVC-linked PE
          # with its own VERSIONINFO; the cosmocc polyglot pad numbers are gone.
          $rustComs = $build.rust_coms
          if ($null -eq $rustComs -or $null -eq $rustComs.'minicon-win-x86_64.com' -or $null -eq $rustComs.'minicon-win-aarch64.com') {
            throw 'build receipt lacks the per-cell rust_coms digests'
          }
          $rustManifest = Get-Content upstream/com/rust/manifest.json -Raw | ConvertFrom-Json
          foreach ($comName in @('minicon-win-x86_64.com', 'minicon-win-aarch64.com')) {
            $entry = $rustManifest.artifacts.$comName
            $comPath = "upstream/com/rust/$comName"
            if ($null -eq $entry) { throw "rust manifest lacks $comName" }
            $digest = (Get-FileHash -LiteralPath $comPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $entry.sha256 -or (Get-Item -LiteralPath $comPath).Length -ne $entry.bytes) { throw "rust manifest mismatch for $comName" }
            if ($digest -ne $rustComs.$comName.sha256) { throw "build receipt rust_coms mismatch for $comName" }
            $raw = [IO.File]::ReadAllBytes((Resolve-Path $comPath))
            if ($raw[0] -ne 0x4D -or $raw[1] -ne 0x5A) { throw "$comName is not a PE" }
          }
          if ($aggregate.source_sha -ne $env:SOURCE_SHA -or
              "$($aggregate.run_id)" -ne $env:UPSTREAM_RUN_ID -or "$($aggregate.run_attempt)" -ne $env:UPSTREAM_ATTEMPT) {
            throw 'unsigned aggregate identity mismatch'
          }
          New-Item -ItemType Directory -Force signed/cells | Out-Null
          New-Item -ItemType Directory -Force signing-input/cells/win-x86_64 | Out-Null
          New-Item -ItemType Directory -Force signing-input/cells/win-aarch64 | Out-Null
          Copy-Item upstream/com/rust/minicon-win-x86_64.com signed/minicon-win-x86_64.com
          Copy-Item upstream/com/rust/minicon-win-aarch64.com signed/minicon-win-aarch64.com
          # The four non-Windows cells court-execute their own unsigned .com
          # artifacts; carry them so the six-runner test matrix needs no
          # second download and proves the one-build manifest end to end.
          Copy-Item upstream/com/rust/minicon-osx-x86_64.com signed/minicon-osx-x86_64.com
          Copy-Item upstream/com/rust/minicon-osx-aarch64.com signed/minicon-osx-aarch64.com
          Copy-Item upstream/com/rust/minicon-lnx-x86_64.com signed/minicon-lnx-x86_64.com
          Copy-Item upstream/com/rust/minicon-lnx-aarch64.com signed/minicon-lnx-aarch64.com
          Copy-Item upstream/com/build-receipt.json signed/build-receipt.json
          Copy-Item upstream/com/rust/manifest.json signed/rust-manifest.json
          Copy-Item upstream/com/courts signed/courts -Recurse
          Copy-Item upstream/aggregate/aggregate-receipt.json signed/unsigned-aggregate-receipt.json
          Copy-Item upstream/native/cells/* signed/cells -Recurse
          Copy-Item loader/ci-status.sh signed/
          Copy-Item loader/ci-status.ps1 signed/
          Copy-Item loader/ci-control.sh signed/
          Copy-Item loader/ci-control.ps1 signed/
          Copy-Item release/signing_receipt.py signed/
          Copy-Item scripts/browser-workspace-smoke.py signed/
          # actions/checkout on a Windows runner may materialize tracked shell
          # scripts with CRLF. These files execute later on Linux/macOS, so
          # publish deterministic LF bytes instead of a host-checkout accident.
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          foreach ($script in Get-ChildItem -LiteralPath signed -Filter '*.sh' -File) {
            $text = [IO.File]::ReadAllText($script.FullName).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($script.FullName, $text, $utf8NoBom)
          }
          $paths = [ordered]@{
            'minicon-win-x86_64.com' = 'signed/minicon-win-x86_64.com'
            'minicon-win-aarch64.com' = 'signed/minicon-win-aarch64.com'
            'win-x86_64' = 'signed/cells/win-x86_64/minicon.exe'
            'win-aarch64' = 'signed/cells/win-aarch64/minicon.exe'
          }
          $before = [ordered]@{}
          foreach ($entry in $paths.GetEnumerator()) {
            $before[$entry.Key] = (Get-FileHash -LiteralPath $entry.Value -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($before['minicon-win-x86_64.com'] -ne $rustComs.'minicon-win-x86_64.com'.sha256 -or
              $before['minicon-win-aarch64.com'] -ne $rustComs.'minicon-win-aarch64.com'.sha256) { throw 'unsigned .com digest mismatch' }
          if ($before['win-x86_64'] -ne $build.payloads.'win-x86_64'.sha256 -or
              $before['win-aarch64'] -ne $build.payloads.'win-aarch64'.sha256) { throw 'unsigned Windows payload digest mismatch' }
          $before | ConvertTo-Json | Set-Content -LiteralPath unsigned-hashes.json -Encoding utf8NoBOM
          Copy-Item signed/minicon-win-x86_64.com signing-input/minicon-win-x86_64.com
          Copy-Item signed/minicon-win-aarch64.com signing-input/minicon-win-aarch64.com
          Copy-Item signed/cells/win-x86_64/minicon.exe signing-input/cells/win-x86_64/minicon.exe
          Copy-Item signed/cells/win-aarch64/minicon.exe signing-input/cells/win-aarch64/minicon.exe
          @('minicon-win-x86_64.com', 'minicon-win-aarch64.com', 'cells\win-x86_64\minicon.exe', 'cells\win-aarch64\minicon.exe') |
            Set-Content -LiteralPath signing-input/signing-catalog.txt -Encoding ascii

      - name: Upload immutable four-file signing input
        id: upload_unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-signing-unsigned-input
          path: signing-input/
          if-no-files-found: error
          retention-days: 14

      - name: Azure login (GitHub OIDC federated identity, signer role only)
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29 # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign exact three files with Azure Artifact Signing (Public Trust)
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: signing-input/signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: MiniCon
          description-url: https://github.com/partnernetsoftware/minicon
          # azure/login exchanges the GitHub OIDC token; the signing action then
          # consumes that short-lived Azure CLI session. Do not probe a second
          # workload-identity path that this runner has not configured.
          exclude-workload-identity-credential: true
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          correlation-id: minicon-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require exactly the four signed paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path signing-input).Path
          $actual = @(Get-ChildItem -LiteralPath $root -File -Recurse | Where-Object { $_.Name -ne 'signing-catalog.txt' } | ForEach-Object {
            $_.FullName.Substring($root.Length + 1).Replace('\', '/')
          } | Sort-Object)
          $expected = @(
            'cells/win-aarch64/minicon.exe',
            'cells/win-x86_64/minicon.exe',
            'minicon-win-aarch64.com',
            'minicon-win-x86_64.com'
          )
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            throw "signing output path set mismatch: $($actual -join ', ')"
          }
          Copy-Item signing-input/minicon-win-x86_64.com signed/minicon-win-x86_64.com -Force
          Copy-Item signing-input/minicon-win-aarch64.com signed/minicon-win-aarch64.com -Force
          Copy-Item signing-input/cells/win-x86_64/minicon.exe signed/cells/win-x86_64/minicon.exe -Force
          Copy-Item signing-input/cells/win-aarch64/minicon.exe signed/cells/win-aarch64/minicon.exe -Force

      - name: Verify publisher, timestamp, and write before-to-after receipt
        id: receipt
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          UPSTREAM_ATTEMPT: ${{ needs.preflight.outputs.upstream_attempt }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_ELIGIBLE: ${{ needs.preflight.outputs.release_eligible }}
        run: |
          $ErrorActionPreference = 'Stop'
          $before = Get-Content unsigned-hashes.json -Raw | ConvertFrom-Json -AsHashtable
          $build = Get-Content signed/build-receipt.json -Raw | ConvertFrom-Json
          $paths = [ordered]@{
            'minicon-win-x86_64.com' = 'minicon-win-x86_64.com'
            'minicon-win-aarch64.com' = 'minicon-win-aarch64.com'
            'win-x86_64' = 'cells/win-x86_64/minicon.exe'
            'win-aarch64' = 'cells/win-aarch64/minicon.exe'
          }
          $assets = [ordered]@{}
          foreach ($entry in $paths.GetEnumerator()) {
            $path = Join-Path (Resolve-Path signed).Path $entry.Value
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($sig.Status -ne 'Valid') { throw "$($entry.Key): Authenticode status $($sig.Status)" }
            if ($null -eq $sig.SignerCertificate -or $null -eq $sig.TimeStamperCertificate) { throw "$($entry.Key): missing signer or timestamp" }
            if ($sig.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=PARTNERNET SOFTWARE PTY LTD(?:,|$)') {
              throw "$($entry.Key): unexpected publisher $($sig.SignerCertificate.Subject)"
            }
            $version = (Get-Item -LiteralPath $path).VersionInfo
            $escapedVersion = [regex]::Escape($env:EXPECTED_VERSION)
            if ($version.ProductName -ne 'MiniCon' -or $version.ProductVersion -notmatch "^$escapedVersion(?:\.0)?$") {
              throw "$($entry.Key): VERSIONINFO mismatch ProductName=$($version.ProductName) ProductVersion=$($version.ProductVersion)"
            }
            $after = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($after -eq $before[$entry.Key]) { throw "$($entry.Key): signing did not change bytes" }
            $assets[$entry.Key] = [ordered]@{
              path = $entry.Value.Replace('\', '/')
              before_sha256 = $before[$entry.Key]
              after_sha256 = $after
              after_bytes = (Get-Item -LiteralPath $path).Length
              authenticode_status = "$($sig.Status)"
              signer_subject = $sig.SignerCertificate.Subject
              signer_issuer = $sig.SignerCertificate.Issuer
              signer_thumbprint = $sig.SignerCertificate.Thumbprint
              signer_not_before = $sig.SignerCertificate.NotBefore.ToUniversalTime().ToString('o')
              signer_not_after = $sig.SignerCertificate.NotAfter.ToUniversalTime().ToString('o')
              timestamp_subject = $sig.TimeStamperCertificate.Subject
              timestamp_issuer = $sig.TimeStamperCertificate.Issuer
              file_product_name = $version.ProductName
              file_product_version = $version.ProductVersion
            }
          }
          $receipt = [ordered]@{
            schema = 2
            kind = 'minicon-trusted-signing'
            source_sha = $env:SOURCE_SHA
            source_tree_digest = $build.source_tree_digest
            product_version = $env:EXPECTED_VERSION
            signing_provider = 'azure-artifact-signing'
            publisher_organization = 'PARTNERNET SOFTWARE PTY LTD'
            file_digest = 'SHA256'
            timestamp_rfc3161 = 'http://timestamp.acs.microsoft.com'
            timestamp_digest = 'SHA256'
            upstream = [ordered]@{ run_id = [int64]$env:UPSTREAM_RUN_ID; run_attempt = [int]$env:UPSTREAM_ATTEMPT }
            signing_run = [ordered]@{ id = [int64]$env:GITHUB_RUN_ID; attempt = [int]$env:GITHUB_RUN_ATTEMPT }
            release_eligible = [bool]::Parse($env:RELEASE_ELIGIBLE)
            assets = $assets
          }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content signed/signing-receipt.json -Encoding utf8NoBOM
          python release/signing_receipt.py --receipt signed/signing-receipt.json --root signed
          foreach ($entry in $paths.GetEnumerator()) {
            $path = Join-Path signed $entry.Value
            $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $([IO.Path]::GetFileName($path))" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          }
          "signed_com_sha256=$($assets['minicon-win-x86_64.com'].after_sha256)" | Out-File $env:GITHUB_OUTPUT -Append
          "signed_com_arm64_sha256=$($assets['minicon-win-aarch64.com'].after_sha256)" | Out-File $env:GITHUB_OUTPUT -Append
          "source_tree_digest=$($build.source_tree_digest)" | Out-File $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: trusted-signed-minicon
          path: signed/
          if-no-files-found: error
          retention-days: 14

  test:
    name: signed ${{ matrix.cell }}
    needs: [preflight, sign]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: lnx-x86_64, runner: ubuntu-24.04, family: linux, expected_os: Linux, expected_arch: X64}
          - {cell: lnx-aarch64, runner: ubuntu-24.04-arm, family: linux, expected_os: Linux, expected_arch: ARM64}
          - {cell: win-x86_64, runner: windows-2025, family: windows, expected_os: Windows, expected_arch: X64}
          - {cell: win-aarch64, runner: windows-11-arm, family: windows, expected_os: Windows, expected_arch: ARM64}
          - {cell: osx-x86_64, runner: macos-15-intel, family: macos, expected_os: macOS, expected_arch: X64}
          - {cell: osx-aarch64, runner: macos-15, family: macos, expected_os: macOS, expected_arch: ARM64}
    runs-on: ${{ matrix.runner }}
    env:
      CELL: ${{ matrix.cell }}
      FAMILY: ${{ matrix.family }}
      EXPECTED_RUNNER_OS: ${{ matrix.expected_os }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.expected_arch }}
      EXPECTED_COM_SHA256: ${{ needs.sign.outputs.signed_com_sha256 }}
      EXPECTED_COM_ARM64_SHA256: ${{ needs.sign.outputs.signed_com_arm64_sha256 }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_SOURCE_TREE_DIGEST: ${{ needs.sign.outputs.source_tree_digest }}
      EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trusted-signed-minicon
          path: bundle
      - name: Guard signed identity (no compile)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          # v0.2.27: only the two Windows cells execute a SIGNED .com; the
          # other four cells run their own unsigned per-cell artifact from the
          # one-build rust manifest (their court evidence, never a Release
          # asset for signing purposes).
          com="bundle/minicon-$CELL.com"
          test -f "$com"
          if [[ "$FAMILY" == "windows" ]]; then
            if [[ "$CELL" == "win-x86_64" ]]; then expected="$EXPECTED_COM_SHA256"; else expected="$EXPECTED_COM_ARM64_SHA256"; fi
          else
            expected=$(python3 -c "import json,os; print(json.load(open('bundle/rust-manifest.json'))['artifacts']['minicon-' + os.environ['CELL'] + '.com']['sha256'])")
          fi
          actual=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$com")
          test "$actual" = "$expected"
          python3 bundle/signing_receipt.py --receipt bundle/signing-receipt.json --root bundle
      - name: version+status+GUI/control (unix)
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bundle/ci-status.sh bundle/ci-control.sh "bundle/minicon-$CELL.com"
          bundle/ci-status.sh "$FAMILY" "bundle/minicon-$CELL.com" bundle/build-receipt.json | tee runtime-body.log
          if [[ "$FAMILY" == linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libxkbcommon-x11-0
            xvfb-run -a bash bundle/ci-control.sh "bundle/minicon-$CELL.com" | tee -a runtime-body.log
          else
            bash bundle/ci-control.sh "bundle/minicon-$CELL.com" | tee -a runtime-body.log
          fi
      - name: version+status+GUI/control (windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $com = "bundle/minicon-$env:CELL.com"
          Copy-Item $com bundle/minicon-signed.exe
          & bundle/ci-status.ps1 -Binary (Join-Path $PWD 'bundle/minicon-signed.exe') `
            -Receipt (Join-Path $PWD 'bundle/build-receipt.json') *>&1 | Tee-Object runtime-body.log
          & bundle/ci-control.ps1 -Binary (Join-Path $PWD 'bundle/minicon-signed.exe') *>&1 | Tee-Object runtime-body.log -Append
      - name: Provision native WebView2 Runtime on the Windows court
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue })
          if ($runtime.Count -eq 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Untrusted WebView2 installer' }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(240000)) { $process.Kill(); throw 'WebView2 installation timed out' }
            if ($process.ExitCode -ne 0) { throw "WebView2 installer exited $($process.ExitCode)" }
          }
      - name: Browser workspace on the signed native Windows executable (no compile)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Get-Content bundle/signing-receipt.json -Raw | ConvertFrom-Json
          $identity = $receipt.assets.($env:CELL)
          $binary = Join-Path 'bundle' $identity.path
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $identity.after_sha256) { throw 'Signed native browser digest mismatch' }
          New-Item -ItemType Directory -Force browser-native | Out-Null
          Copy-Item -LiteralPath $binary -Destination browser-native/minicon.exe
          python bundle/browser-workspace-smoke.py browser-native/minicon.exe --output browser-workspace
          if ($LASTEXITCODE -ne 0) { throw 'Signed native browser workspace failed' }
      - name: Runtime receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          log = Path("runtime-body.log")
          com = Path(f"bundle/minicon-{os.environ['CELL']}.com")
          actual_digest = hashlib.sha256(com.read_bytes()).hexdigest() if com.is_file() else None
          data = {
              "schema": 1, "kind": "minicon-signed-runtime", "cell": os.environ["CELL"],
              "job_status": os.environ["JOB_STATUS"], "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "source_tree_digest": os.environ["EXPECTED_SOURCE_TREE_DIGEST"],
              "rust_com_sha256": actual_digest, "product_version": os.environ["EXPECTED_VERSION"],
          }
          if log.is_file():
              raw = log.read_bytes(); data.update(log_sha256=hashlib.sha256(raw).hexdigest(), log_bytes=len(raw))
          if os.environ['FAMILY'] == 'windows' and os.environ['JOB_STATUS'] == 'success':
              raw = Path('browser-workspace/receipt.json').read_bytes()
              journey = json.loads(raw)
              signing = json.loads(Path('bundle/signing-receipt.json').read_text(encoding='utf-8-sig'))
              assert journey['status'] == 'passed'
              assert journey['binary_sha256'] == signing['assets'][os.environ['CELL']]['after_sha256']
              data.update(native_browser_sha256=journey['binary_sha256'], native_browser_status=journey['status'],
                          native_browser_receipt_sha256=hashlib.sha256(raw).hexdigest())
          Path("runtime-receipt.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: signed-runtime-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: |
            runtime-receipt.json
            runtime-body.log
            browser-workspace/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: require six signed PASS same after-SHA
    if: always()
    needs: [preflight, sign, test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-runtime-*-attempt-${{ github.run_attempt }}
          path: receipts
      - name: Seal signed six-cell aggregate
        env:
          EXPECTED_COM_SHA256: ${{ needs.sign.outputs.signed_com_sha256 }}
          EXPECTED_COM_ARM64_SHA256: ${{ needs.sign.outputs.signed_com_arm64_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_SOURCE_TREE_DIGEST: ${{ needs.sign.outputs.source_tree_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
          RELEASE_ELIGIBLE: ${{ needs.preflight.outputs.release_eligible }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          wanted = {"lnx-x86_64","lnx-aarch64","win-x86_64","win-aarch64","osx-x86_64","osx-aarch64"}
          run_id, attempt = os.environ["GITHUB_RUN_ID"], int(os.environ["GITHUB_RUN_ATTEMPT"])
          rows = [json.loads(p.read_text()) for p in Path("receipts").rglob("runtime-receipt.json")]
          rows = [r for r in rows if str(r.get("run_id")) == run_id and int(r.get("run_attempt", -1)) == attempt]
          cells = [r.get("cell") for r in rows]
          if len(rows) != 6 or set(cells) != wanted or len(set(cells)) != 6: raise SystemExit(f"cell set mismatch: {cells}")
          if any(r.get("job_status") != "success" for r in rows): raise SystemExit("one or more signed runtime courts failed")
          if any(r.get('native_browser_status') != 'passed' for r in rows if r['cell'].startswith('win-')):
              raise SystemExit('signed native Windows browser court missing or failed')
          for field, expected in (("source_sha", os.environ["EXPECTED_SOURCE_SHA"]),
                                  ("source_tree_digest", os.environ["EXPECTED_SOURCE_TREE_DIGEST"])):
              if {r.get(field) for r in rows} != {expected}: raise SystemExit(f"{field} mismatch")
          # Windows rows must have executed the SIGNED bytes; the four other
          # cells their own manifest-bound artifacts.
          for row in rows:
              if not row.get("rust_com_sha256"): raise SystemExit("missing rust_com_sha256")
          win64 = next(r for r in rows if r["cell"] == "win-x86_64")
          winarm = next(r for r in rows if r["cell"] == "win-aarch64")
          if win64["rust_com_sha256"] != os.environ["EXPECTED_COM_SHA256"]: raise SystemExit("signed win-x86_64 .com digest mismatch")
          if winarm["rust_com_sha256"] != os.environ["EXPECTED_COM_ARM64_SHA256"]: raise SystemExit("signed win-aarch64 .com digest mismatch")
          out = {"schema": 1, "kind": "minicon-signed-six-cell-aggregate", "run_id": int(run_id),
                 "run_attempt": attempt, "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
                 "source_tree_digest": os.environ["EXPECTED_SOURCE_TREE_DIGEST"],
                 "minicon_com_sha256": os.environ["EXPECTED_COM_SHA256"],
                 "rust_coms": {"minicon-win-x86_64.com": {"sha256": os.environ["EXPECTED_COM_SHA256"]},
                                "minicon-win-aarch64.com": {"sha256": os.environ["EXPECTED_COM_ARM64_SHA256"]}},
                 "artifact_id": os.environ["EXPECTED_ARTIFACT_ID"], "cells": sorted(cells),
                 "release_eligible": os.environ["RELEASE_ELIGIBLE"] == "true",
                 "strategy": "current-attempt-only-full-six"}
          Path("signed-aggregate-receipt.json").write_text(json.dumps(out, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-aggregate-attempt-${{ github.run_attempt }}
          path: signed-aggregate-receipt.json
          if-no-files-found: error
          retention-days: 14
