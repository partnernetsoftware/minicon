name: dev-loop-crosscheck

# A dev-loop validation court for an agent that cross-compiles nothing itself:
# push a fix to `main`, dispatch this, and each requested cell builds and
# tests *natively* on its own runner -- the same "compile on the cell that
# will run it" pattern `six-grid-cloud-build.yml` already uses for the
# release-evidence path, minus that path's GHCR publish and receipt/identity
# bookkeeping (which ties into release evidence and is out of scope here).
# No GHCR token, no release, no new tag: `contents: read` is enough, because
# the result an agent needs is pass/fail plus logs, not a redistributable
# body. See plan/plan-carried-debt.md's G1 leaf for why this exists --
# local-artifact-probe.yml needs a pre-built bundle behind a release asset,
# and creating or updating a release is blocked for this kind of session.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to check out; empty uses the default branch"
        required: false
        default: ""
      cells:
        description: >-
          Space-separated cells to build+test; empty runs the four
          non-macOS cells (macOS runners bill ~10x Linux and queue longest --
          opt in with "all" or the osx-* names when a macOS-specific
          question needs it)
        required: false
        default: ""
      test_filter:
        description: "Optional Rust test-name substring filter, applied to every suite"
        required: false
        default: ""
      private_publication:
        description: "Run native private-publication source tests and actual guard counterexamples"
        type: boolean
        required: false
        default: false
      native_auth_context:
        description: "Run dedicated native auth storage/live-DOM bytes and actual counterexamples"
        type: boolean
        required: false
        default: false
      windows_profile_acl_contrast:
        description: "Windows x64 only: same-image synthetic UDF permission-policy diagnostic (not qualification)"
        type: boolean
        required: false
        default: false
      windows_cookie_lifetime_contrast:
        description: "Windows x64 only: direct-wry same-image KEEP/EXIT lifetime diagnostic (not qualification)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          CELLS: ${{ inputs.cells }}
          ACL_CONTRAST: ${{ inputs.windows_profile_acl_contrast }}
          NATIVE_AUTH: ${{ inputs.native_auth_context }}
          PRIVATE_PUBLICATION: ${{ inputs.private_publication }}
          LIFETIME_CONTRAST: ${{ inputs.windows_cookie_lifetime_contrast }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {
              "lnx-x86_64": {"runner": "ubuntu-24.04", "triple": "x86_64-unknown-linux-gnu"},
              "lnx-aarch64": {"runner": "ubuntu-24.04-arm", "triple": "aarch64-unknown-linux-gnu"},
              "win-x86_64": {"runner": "windows-2025", "triple": "x86_64-pc-windows-msvc"},
              "win-aarch64": {"runner": "windows-11-arm", "triple": "aarch64-pc-windows-msvc"},
              "osx-aarch64": {"runner": "macos-15", "triple": "aarch64-apple-darwin"},
              "osx-x86_64": {"runner": "macos-15-intel", "triple": "x86_64-apple-darwin"},
          }
          raw = os.environ.get("CELLS", "").split()
          non_macos = [c for c in runners if not c.startswith("osx-")]
          if not raw:
              wanted = non_macos
          elif raw == ["all"]:
              wanted = list(runners)
          else:
              wanted = raw
          if os.environ.get("ACL_CONTRAST", "").lower() == "true":
              if wanted != ["win-x86_64"] or os.environ.get("NATIVE_AUTH", "").lower() == "true":
                  raise SystemExit("ACL diagnostic requires exactly win-x86_64 and native_auth_context=false")
          if os.environ.get("LIFETIME_CONTRAST", "").lower() == "true":
              incompatible = any(os.environ.get(k, "").lower() == "true" for k in ("NATIVE_AUTH", "ACL_CONTRAST", "PRIVATE_PUBLICATION"))
              if wanted != ["win-x86_64"] or incompatible:
                  raise SystemExit("Lifetime diagnostic requires exactly win-x86_64 and native_auth_context/windows_profile_acl_contrast/private_publication=false")
          unknown = [c for c in wanted if c not in runners]
          if unknown:
              raise SystemExit(f"unknown cells: {unknown}")
          include = [{"cell": c, **runners[c]} for c in wanted]
          print("matrix=" + json.dumps({"include": include}))
          PY

  build-and-test:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Compile plus test, on one runner, natively -- no cross toolchain, no
    # transfer step to go wrong. 50 minutes covers a cold `cargo build` for
    # this workspace's size, the Windows cells' native rust-console PTY suite
    # and the release product build the throughput suite drives (both added
    # for 0.2.20), with slack for the run loop below; a genuine
    # hang (the class of bug this court exists to reproduce) still hits this
    # cap and reports as `cancelled`, which the log-upload step below also
    # covers.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Same rationale as local-artifact-probe.yml: a hosted Linux runner has
      # no display, and MiniCon is a windowed terminal.
      - name: Give Linux a display to draw on
        if: startsWith(matrix.cell, 'lnx-')
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb binutils libgtk-3-dev libwebkit2gtk-4.1-dev
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Linux X11 tests used to `return` when DISPLAY was unset and still
          # report ok. This job exists to run those paths; a missing display
          # must fail them. See plan/archive/plan-v0.2.21.md {LNX}.
          echo "MINICON_REQUIRE_DISPLAY=1" >> "$GITHUB_ENV"
          for _ in $(seq 20); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          DISPLAY=:99 xdpyinfo | head -3

      - name: Provision native WebView2 Runtime on the Windows court
        if: startsWith(matrix.cell, 'win-')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PRD 27: disposable court setup, never a bundled product runtime.
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue })
          if ($runtime.Count -eq 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Untrusted WebView2 installer' }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(240000)) { $process.Kill(); throw 'WebView2 installation timed out' }
            if ($process.ExitCode -ne 0) { throw "WebView2 installer exited $($process.ExitCode)" }
          }

      - name: Build the cell's product and harnesses
        shell: bash
        run: cargo build --locked --workspace --all-targets --target "${{ matrix.triple }}"

      - name: Run the standard workspace and owned-fork gate on the isolated desktop
        id: standard_workspace
        continue-on-error: true
        if: matrix.cell == 'win-x86_64' && inputs.test_filter == '' && !inputs.windows_cookie_lifetime_contrast && !inputs.windows_profile_acl_contrast
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-logs
          bash scripts/build.sh test --target '${{ matrix.triple }}' -- --test-threads=1 \
            2>&1 | tee probe-logs/standard-workspace-test.log
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          log = Path('probe-logs/standard-workspace-test.log')
          rows = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', log.read_text(errors='replace'), re.M)
          assert rows and all(row[0] == 'ok' and int(row[2]) == 0 for row in rows)
          Path('probe-logs/standard-workspace-receipt.json').write_text(json.dumps({
              'status': 'PASS', 'source': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              'target': '${{ matrix.triple }}', 'command': 'scripts/build.sh test',
              'passed': sum(int(row[1]) for row in rows),
              'ignored': sum(int(row[3]) for row in rows),
              'scope': 'Standard workspace and owned forks; ignored opt-ins remain unqualified.',
          }, indent=2) + '\n')
          PY

      - name: Qualify the canonical native browser workspace
        shell: bash
        run: |
          set -euo pipefail
          triple='${{ matrix.triple }}'
          extension=''
          if [[ '${{ matrix.cell }}' == win-* ]]; then extension='.exe'; fi
          if [[ '${{ matrix.cell }}' == lnx-* ]]; then
            cargo build --locked --target "$triple" -p minicon-web --features wry-host --bin minicon-web-host
            mkdir -p target/browser-helpers
            cp "target/$triple/debug/minicon-web-host" target/browser-helpers/minicon-web-host
            strip target/browser-helpers/minicon-web-host
            export MINICON_BROWSER_EMBEDDED_HOST="$PWD/target/browser-helpers/minicon-web-host"
          fi
          cargo build --locked --target "$triple" --bin minicon
          mkdir -p target/browser-canonical
          cp "target/$triple/debug/minicon$extension" "target/browser-canonical/minicon$extension"
          binary="$PWD/target/browser-canonical/minicon$extension"
          if [[ '${{ matrix.cell }}' == win-* ]]; then binary=$(cygpath -w "$binary"); fi
          mkdir -p probe-logs
          MINICON_TEST_BINARY="$binary" bash scripts/build.sh test-suite --target "$triple" \
            --test minicon_control browser_windows::native_browser_address_redirect_history_and_failure -- --exact --ignored \
            2>&1 | tee probe-logs/browser-workspace-test.log
          python3 scripts/browser-workspace-smoke.py "$binary" --output probe-logs/browser-workspace

      - name: Qualify profile keys and handoff on an isolated Windows desktop
        if: matrix.cell == 'win-x86_64' && !inputs.windows_cookie_lifetime_contrast && !inputs.windows_profile_acl_contrast
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cygpath -w "$PWD/target/browser-canonical/minicon.exe")
          repo=$(cygpath -w "$PWD")
          output=$(cygpath -w "$PWD/target/profile-key-handoff")
          digest=$(python3 -c 'import hashlib,sys;from pathlib import Path;print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' "$binary")
          status=0
          python3 -B scripts/profile-key-handoff-smoke.py --repo "$repo" \
            --binary "$binary" --binary-sha256 "$digest" --output "$output" \
            --execute --allow-owned-background-gui --isolated-ci-clipboard || status=$?
          # The private carrier contains synthetic keys and is never uploaded.
          # Only this explicit safe receipt belongs in the existing log artifact.
          if [ -f target/profile-key-handoff/receipt.json ]; then
            cp target/profile-key-handoff/receipt.json probe-logs/profile-key-handoff.json
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          r = json.loads(Path('target/profile-key-handoff/receipt.json').read_bytes())
          assert r['status'] == 'PASS' and r['actual_public_checks'] == 12
          assert r['clipboard_mode'] and r['rejecting_proxy_requests'] == 0
          assert not r['cleanup_errors'] and r['public_upload_allowlist'] == ['receipt.json']
          PYVERIFY

      - name: Qualify native authorization contexts and parked ordinary page
        if: inputs.native_auth_context
        shell: bash
        run: |
          set -euo pipefail
          triple='${{ matrix.triple }}'
          extension=''
          if [[ '${{ matrix.cell }}' == win-* ]]; then extension='.exe'; fi
          # macOS ships Bash 3.2: an empty array expansion fails under nounset.
          set --
          if [[ '${{ matrix.cell }}' == lnx-* ]]; then
            set -- --helper "$PWD/target/browser-helpers/minicon-web-host"
          fi
          python3 scripts/native-auth-context/qualify.py --target "$triple" \
            --canonical-product "$PWD/target/browser-canonical/minicon$extension" \
            --output probe-logs/native-auth-context "$@"

      - name: Observe fresh Windows fixture permission-policy contrast
        if: inputs.windows_profile_acl_contrast && matrix.cell == 'win-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/native-auth-context/acl_selfcheck.py
          python3 scripts/native-auth-context/qualify.py --target '${{ matrix.triple }}' \
            --canonical-product "$PWD/target/browser-canonical/minicon.exe" \
            --output probe-logs/native-auth-context --windows-profile-acl-contrast

      - name: Observe direct-wry Windows browser lifetime contrast
        if: inputs.windows_cookie_lifetime_contrast && matrix.cell == 'win-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostic only. Both original verdicts remain separate; a FAIL is
          # still a failing job, not a successful qualification/restored court.
          python3 -B scripts/native-auth-context/lifetime.py --build \
            --target '${{ matrix.triple }}' \
            --canonical-product "$PWD/target/browser-canonical/minicon.exe" \
            --output probe-logs/windows-cookie-lifetime

      - name: Qualify bounded control shutdown responses
        # Required on every cell, independently of the optional suite filter.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-logs
          bash scripts/build.sh test-suite --target '${{ matrix.triple }}' --bin minicon \
            control::shutdown_response_tests -- --test-threads 1 \
            2>&1 | tee probe-logs/control-shutdown-response.log
          python3 - '${{ matrix.cell }}' <<'PY'
          import re, sys
          from pathlib import Path
          text = Path('probe-logs/control-shutdown-response.log').read_text(encoding='utf-8')
          expected = 4 if sys.argv[1].startswith('win-') else 3
          summaries = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', text, re.MULTILINE)
          if summaries != [('ok', str(expected), '0', '0')]:
              raise SystemExit(f'control shutdown court requires exactly {expected} passed, 0 failed/ignored; observed {summaries}')
          print(f'control shutdown court: exactly {expected} passed, 0 failed/ignored')
          PY

      - name: Qualify owned macOS placement, mapping and public CLI host route
        # Native owned-window court is required on both macOS cells regardless
        # of test_filter; this is not hardware/WK-focus or release qualification.
        if: startsWith(matrix.cell, 'osx-')
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-logs
          python3 -B scripts/macos-snap-half-native-court.py --target '${{ matrix.triple }}' \
            --output probe-logs/macos-snap-half \
            2>&1 | tee probe-logs/macos-snap-half-driver.log

      - name: Run each suite, capturing every result before failing the job
        # These are Cargo integration/unit tests, not standalone binaries --
        # their real names on disk are hashed (target/<triple>/debug/deps/
        # minicon_core-<hash>). Let `cargo test` locate and run each one
        # itself rather than guessing a path; a guessed path that never
        # matches silently skips the suite and reports a false pass (found
        # 2026-09-27: run 36312887935 "succeeded" without executing a single
        # test, for exactly this reason).
        shell: bash
        env:
          LOG_DIR: probe-logs
          JOB_STATUS: ${{ job.status }}
          CELL: ${{ matrix.cell }}
        run: |
          set -eu
          mkdir -p "$LOG_DIR"
          triple='${{ matrix.triple }}'
          failed=""
          # Per-suite name/status/seconds, so a green run still leaves a
          # structured result. The log-upload step below fires only on
          # failure/cancel, so before this a passing run left nothing behind
          # to read a per-suite outcome or a per-cell cost from (2026-10-10).
          results="$LOG_DIR/results.tsv"
          : > "$results"
          run_suite() {
            local name="$1"; shift
            local t0 t1 st
            t0=$(date +%s)
            if "$@" 2>&1 | tee -a "$LOG_DIR/$name.log"; then st=ok; else st=failed; failed="$failed $name"; fi
            t1=$(date +%s)
            printf '%s\t%s\t%s\n' "$name" "$st" "$((t1 - t0))" >> "$results"
          }
          echo "== minicon-core (lib unit tests) ${{ inputs.test_filter }}"
          run_suite minicon-core cargo test --locked --target "$triple" -p minicon-core -- --test-threads 2 ${{ inputs.test_filter }}
          # An explicit filter may legally match nothing. Unfiltered portable
          # console suites may not.
          filter='${{ inputs.test_filter }}'
          # Portable minicon-console library. cfg(windows) service code is
          # absent on lnx-* and osx-*; an unfiltered run must still execute
          # tests. A hashed-path guess that matches nothing is a false pass
          # (plan/archive/plan-v0.2.21.md {LIB}). Cargo locates the binary.
          echo "== minicon-console (portable library) ${{ inputs.test_filter }}"
          run_suite minicon-console cargo test --locked --target "$triple" -p minicon-console --lib -- --test-threads 2 ${{ inputs.test_filter }}
          echo "== minicon-console synchronized_presentation ${{ inputs.test_filter }}"
          run_suite minicon-console-synchronized-presentation cargo test --locked --target "$triple" -p minicon-console --test synchronized_presentation -- --test-threads 2 ${{ inputs.test_filter }}
          echo "== minicon-console presentation_allocations ${{ inputs.test_filter }}"
          run_suite minicon-console-presentation-allocations cargo test --locked --target "$triple" -p minicon-console --test presentation_allocations -- --test-threads 2 ${{ inputs.test_filter }}
          if [ -z "$filter" ]; then
            for suite in minicon-console minicon-console-synchronized-presentation minicon-console-presentation-allocations; do
              if ! grep -Eq 'running [1-9][0-9]* tests?' "$LOG_DIR/$suite.log"; then
                echo "SUITE $suite executed no tests" | tee -a "$LOG_DIR/summary.log"
                case " $failed " in
                  *" $suite "*) ;;
                  *) failed="$failed $suite" ;;
                esac
              fi
            done
          fi
          echo "== minicon-ui-core (shared types and pixel kernels) ${{ inputs.test_filter }}"
          run_suite minicon-ui-core cargo test --locked --target "$triple" -p minicon-ui-core --lib -- --test-threads 2 ${{ inputs.test_filter }}
          # Keep this outside workspace feature unification. An explicit native
          # target binds the consumer evidence to this matrix cell even if the
          # runner happens to use a translated host toolchain.
          echo "== isolated minimal reuse consumer"
          run_suite minimal-reuse env CARGO_BUILD_TARGET="$triple" bash scripts/check-reuse.sh
          # The alignment suite reads the repository and the built binary, and
          # no other workflow runs it: 0.2.6 shipped with
          # `the_help_and_readme_list_the_same_shortcuts` failing because the
          # only gate that would have caught it lived in `scripts/build.sh test`
          # and never ran here.
          echo "== minicon_alignment ${{ inputs.test_filter }}"
          run_suite minicon_alignment cargo test --locked --target "$triple" --test minicon_alignment -- --test-threads 2 ${{ inputs.test_filter }}
          for suite in minicon_blackbox minicon_control; do
            echo "== $suite ${{ inputs.test_filter }}"
            test_threads=2
            # The control target owns shared desktop/clipboard gestures.
            # Browser editors and composer image paste must not race each other.
            if [ "$suite" = minicon_control ]; then test_threads=1; fi
            run_suite "$suite" cargo test --locked --target "$triple" --test "$suite" -- --test-threads "$test_threads" ${{ inputs.test_filter }}
          done
          # This headless CLI court uses a controlled model peer; it proves
          # worker-owned tools and resume binding on this native cell without
          # claiming an OAuth account or hosted-provider entitlement.
          if [ -z "$filter" ] || [[ "$filter" == *gateway* ]] || [[ "$filter" == *harness* ]] || [[ "$filter" == *provider* ]]; then
            run_suite minicon_harness_gateway bash scripts/build.sh test-suite --target "$triple" --test minicon_harness gateway_worker_ -- --test-threads 2
          fi
          if [ -z "$filter" ] || [[ "$filter" == *provider* ]]; then
            run_suite minicon-provider bash scripts/build.sh test-suite --target "$triple" --bin minicon provider_ -- --test-threads 2
          fi
          if [ -z "$filter" ] || [[ "$filter" == *provider* ]] || [[ "$filter" == *harness* ]] || [[ "$filter" == *auth* ]]; then
            run_suite minicon-auth-presentation bash scripts/build.sh test-suite --target "$triple" --bin minicon harness_auth_ui::tests -- --test-threads 1
            run_suite minicon-auth-settings bash scripts/build.sh test-suite --target "$triple" --bin minicon harness_settings_ui:: -- --test-threads 1
            run_suite minicon-account-presentation bash scripts/build.sh test-suite --target "$triple" --bin minicon harness_account_ui::tests -- --test-threads 1
            run_suite minicon-harness-cached bash scripts/build.sh test-suite --target "$triple" --bin minicon harness_workspace_ui::tests::h1_cached_cards_keep_stale_wallets_and_applied_client_identity -- --exact --test-threads 1
            run_suite minicon-harness-cached-public bash scripts/build.sh test-suite --target "$triple" --test minicon_control browser_windows::host_harness_dashboard_reuses_account_state_and_targets_named_client -- --exact --test-threads 1
            run_suite minicon-web-context bash scripts/build.sh test-suite --target "$triple" -p minicon-web --lib profile::tests -- --test-threads 1
            run_suite minicon-web-process-selector bash scripts/build.sh test-suite --target "$triple" -p minicon-web --lib embedded_process_ -- --test-threads 1
            if [[ "$CELL" == win-* || "$CELL" == osx-* ]]; then
              run_suite minicon-web-native-profile bash scripts/build.sh test-suite --target "$triple" -p minicon-web --features native-page-host --lib native_page:: -- --test-threads 1
            fi
            run_suite minicon-harness-workspace bash scripts/build.sh test-suite --target "$triple" --bin minicon h0_ -- --test-threads 1
            run_suite minicon-workspace-geometry bash scripts/build.sh test-suite --target "$triple" --bin minicon ui::tests:: -- --test-threads 1
            run_suite minicon-control-pending bash scripts/build.sh test-suite --target "$triple" --bin minicon control_pending::tests -- --test-threads 1
            run_suite minicon-harness-workspace-public bash scripts/build.sh test-suite --target "$triple" --test minicon_control h0_harness_destination_preserves_console_and_web_drafts_and_observes_only -- --exact --test-threads 1
            if [[ "$CELL" == lnx-* ]]; then
              run_suite minicon-browser-process bash scripts/build.sh test-suite --target "$triple" --bin minicon browser_process::tests -- --test-threads 1
              run_suite minicon-web-process-native bash scripts/build.sh test-suite --target "$triple" -p minicon-web --lib tests::embedded_page_process_selector_maps_and_resizes_only_its_direct_owned_child -- --exact --ignored --test-threads 1
            fi
            auth_suites="minicon-auth-presentation minicon-auth-settings minicon-web-context minicon-web-process-selector minicon-harness-workspace minicon-workspace-geometry minicon-control-pending minicon-harness-workspace-public"
            auth_suites="$auth_suites minicon-account-presentation minicon-harness-cached minicon-harness-cached-public"
            if [[ "$CELL" == win-* || "$CELL" == osx-* ]]; then auth_suites="$auth_suites minicon-web-native-profile"; fi
            if [[ "$CELL" == lnx-* ]]; then auth_suites="$auth_suites minicon-browser-process minicon-web-process-native"; fi
            for suite in $auth_suites; do
              if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$LOG_DIR/$suite.log"; then
                echo "SUITE $suite requires executed passing tests with zero failed/ignored" | tee -a "$LOG_DIR/summary.log"
                case " $failed " in
                  *" $suite "*) ;;
                  *) failed="$failed $suite" ;;
                esac
              fi
            done
          fi
          if [ -z "$filter" ] || [[ "$filter" == *harness* ]]; then
            run_suite minicon-worker bash scripts/build.sh test-suite --target "$triple" --bin minicon harness:: -- --test-threads 2
          fi
          if [ -z "$filter" ] || [[ "$filter" == *network* ]]; then
            run_suite minicon-network bash scripts/build.sh test-suite --target "$triple" -p minicon-platform --features network-http-stream,network-loopback --lib network_ -- --test-threads 2
          fi
          # Opt-in source mechanism court, independent of the ordinary filter.
          # It requires 3 baseline passes, 3 actual assertion REDs and 3 restored
          # passes; partial/compile/timeout results cannot certify the controls.
          if [[ '${{ inputs.private_publication }}' == 'true' ]]; then
            run_suite private-publication python3 scripts/private-publication-native-court.py --target "$triple" --output "$LOG_DIR/private-publication"
          fi
          case "$CELL" in
            osx-*)
              if [ -z "$filter" ] || [[ "$filter" == *harness* ]] || [[ "$filter" == *provider* ]] || [[ "$filter" == *retained_group* ]]; then
                run_suite macos-retained-group python3 scripts/retained-group-native-court.py --target "$triple" --output "$LOG_DIR/retained-group"
              fi
              ;;
          esac
          # Throughput is a property of the shipped artifact, so the suite
          # drives an optimized product binary. A debug build measures the
          # unoptimized parser instead: the owned Windows console streams and
          # parses every byte (a screen-scraping backend delivers a fraction),
          # and in debug that alone missed the 32 MiB / 30 s budget while the
          # release binary met it with 3x headroom (2026-10-22).
          # A filtered run that does not name throughput skips the release
          # build entirely: it costs minutes and selects no test.
          if [ -z "$filter" ] || [ "${filter#*throughput}" != "$filter" ] || [ "${filter#*sustained}" != "$filter" ]; then
            echo "== release product build for throughput"
            run_suite throughput-release-build cargo build --locked --release --target "$triple" --bin minicon
            exe_suffix=""
            case "$CELL" in win-*) exe_suffix=".exe" ;; esac
            echo "== minicon_throughput --include-ignored --nocapture (release product) ${{ inputs.test_filter }}"
            run_suite minicon_throughput env MINICON_TEST_BINARY="$PWD/target/$triple/release/minicon$exe_suffix" cargo test --locked --target "$triple" --test minicon_throughput -- --test-threads 2 --include-ignored --nocapture ${{ inputs.test_filter }}
          fi
          case "$CELL" in
            win-*)
              # This suite is `#![cfg(windows)]` -- the pre-ConPTY console-agent
              # backend, only reachable on Windows.
              echo "== minicon_console_agent ${{ inputs.test_filter }}"
              run_suite minicon_console_agent cargo test --locked --target "$triple" --test minicon_console_agent -- --test-threads 1 ${{ inputs.test_filter }}
              # The owned rust-console provider's native PTY sessions. Without
              # this step no cell ever executed an actual Rust-provider session
              # off the developer's x64 host, which left Windows ARM64 runtime
              # evidence BLOCKED for the 0.2.20 default decision.
              echo "== rust_console_pty (feature rust-console) ${{ inputs.test_filter }}"
              run_suite rust_console_pty cargo test --locked --target "$triple" -p minicon-platform --features rust-console --test rust_console_pty -- --test-threads 1 ${{ inputs.test_filter }}
              # A diagnostic scope compares the same disconnect fixtures with
              # the installed system host, without enabling every ignored SDK
              # differential or changing the ordinary product pass criteria.
              if [[ "$filter" == *disconnect_stock* ]]; then
                for court in rust_console_client_queued_read_disconnect_compares_system_conpty rust_console_client_read_retirement_compares_system_conpty; do
                  run_suite "$court" cargo test --locked --target "$triple" -p minicon-platform --features rust-console --test rust_console_pty -- "$court" --exact --ignored --test-threads 1 --nocapture
                done
              fi
              # OAuth bearer publication delegates its security boundary to
              # minicon-platform. Compile-only Windows evidence cannot prove
              # that the installed DACL is protected and current-user-only.
              # Keep this security court independent of the general test-name
              # filter, as check-reuse is: an unrelated focused run must not
              # erase the Windows ACL evidence.
              echo "== Windows private filesystem ACL"
              run_suite windows-private-filesystem cargo test --locked --target "$triple" -p minicon-platform --features filesystem --lib -- private_ --test-threads 1
              if ! grep -Eq 'running [1-9][0-9]* tests?' "$LOG_DIR/windows-private-filesystem.log"; then
                echo "SUITE windows-private-filesystem executed no tests" | tee -a "$LOG_DIR/summary.log"
                case " $failed " in
                  *" windows-private-filesystem "*) ;;
                  *) failed="$failed windows-private-filesystem" ;;
                esac
              fi
              ;;
            lnx-*)
              # Linux-only product paths. A macOS build never compiles the
              # /proc session walk, and these X11 tests are not part of
              # blackbox/control. Do not run the whole platform lib.
              # plan/archive/plan-v0.2.21.md {LNX}.
              echo "== linux pty session ${{ inputs.test_filter }}"
              # A filter is a substring of these names, not a license to run
              # the rest of the platform lib. An unrelated filter skips the
              # suite instead of selecting hundreds of other tests.
              pty_names="openpty_spawn_write_read_round_trip forced_cleanup_empties_the_owned_session_with_resistant_children retained_master_signals_and_verifies_its_foreground_group"
              if [ -z "$filter" ]; then
                # shellcheck disable=SC2086
                run_suite linux-pty cargo test --locked --target "$triple" -p minicon-platform --features pty --lib -- --test-threads 1 $pty_names
              elif case "$pty_names" in *"$filter"*) true ;; *) false ;; esac; then
                run_suite linux-pty cargo test --locked --target "$triple" -p minicon-platform --features pty --lib -- --test-threads 1 "$filter"
              fi
              echo "== linux x11 clipboard ${{ inputs.test_filter }}"
              x11_names="native_x11_available_types_when_display_is_set native_x11_clipboard_round_trip_when_display_is_set"
              if [ -z "$filter" ]; then
                # shellcheck disable=SC2086
                run_suite linux-x11-clipboard cargo test --locked --target "$triple" -p minicon-platform --features clipboard --lib -- --test-threads 1 $x11_names
              elif case "$x11_names" in *"$filter"*) true ;; *) false ;; esac; then
                run_suite linux-x11-clipboard cargo test --locked --target "$triple" -p minicon-platform --features clipboard --lib -- --test-threads 1 "$filter"
              fi
              echo "== linux elf load-time gate ${{ inputs.test_filter }}"
              run_suite linux-elf-needed cargo test --locked --target "$triple" --test minicon_load_portability_linux -- --test-threads 1 ${{ inputs.test_filter }}
              # Browser content-panel runtime courts. Keep them independent of
              # a generic Rust filter: a focused rerun must not erase native X
              # resize or real WebKit OAuth evidence.
              echo "== native X embedded-page resize"
              run_suite minicon-web-x11 cargo test --locked --target "$triple" -p minicon-web --lib tests::embedded_page_resize_moves_and_sizes_a_classed_x_child -- --exact --test-threads 1
              echo "== build the optional wry/WebKitGTK page host"
              run_suite minicon-web-wry-build cargo build --locked --target "$triple" -p minicon-web --features wry-host --bin minicon-web-host
              echo "== real WebKit proxy + OAuth loopback navigation"
              run_suite minicon-web-live-oauth python3 scripts/minicon-web-live-smoke.py "$PWD/target/$triple/debug/minicon-web-host"
              if [ -z "$filter" ]; then
                for suite in linux-pty linux-x11-clipboard linux-elf-needed; do
                  if ! grep -Eq 'running [1-9][0-9]* tests?' "$LOG_DIR/$suite.log"; then
                    echo "SUITE $suite executed no tests" | tee -a "$LOG_DIR/summary.log"
                    case " $failed " in
                      *" $suite "*) ;;
                      *) failed="$failed $suite" ;;
                    esac
                  fi
                done
              fi
              if ! grep -Eq 'running [1-9][0-9]* tests?' "$LOG_DIR/minicon-web-x11.log"; then
                echo "SUITE minicon-web-x11 executed no tests" | tee -a "$LOG_DIR/summary.log"
                case " $failed " in
                  *" minicon-web-x11 "*) ;;
                  *) failed="$failed minicon-web-x11" ;;
                esac
              fi
              ;;
          esac
          # Written before the failure exit below, so a red run still ships a
          # receipt naming which suites failed and how long each took.
          {
            printf '{\n'
            printf '  "schema": 1,\n'
            printf '  "cell": "%s",\n' "$CELL"
            printf '  "triple": "%s",\n' "$triple"
            printf '  "source_sha": "%s",\n' "${GITHUB_SHA:-unknown}"
            printf '  "job_status": "%s",\n' "${JOB_STATUS:-unknown}"
            printf '  "suites": [\n'
            first=1
            while IFS=$'\t' read -r name status secs; do
              [ -n "$name" ] || continue
              if [ "$first" = 1 ]; then first=0; else printf ',\n'; fi
              printf '    {"name": "%s", "status": "%s", "seconds": %s}' "$name" "$status" "$secs"
            done < "$results"
            printf '\n  ],\n'
            printf '  "suites_total_seconds": %s\n' "$(awk -F'\t' '{s += $3} END {print s + 0}' "$results")"
            printf '}\n'
          } > "$LOG_DIR/test-receipt.json"
          cat "$LOG_DIR/test-receipt.json"
          if [ -n "$failed" ]; then
            echo "CROSSCHECK failed suites:$failed" | tee -a "$LOG_DIR/summary.log"
            exit 1
          fi

      - name: Retain a failed standard gate after independent courts finish
        if: always() && steps.standard_workspace.outcome == 'failure'
        shell: bash
        run: |
          echo 'Standard workspace/owned-fork gate failed; independent court results do not override it.' >&2
          exit 1

      - name: Preserve owned Windows console lifecycle traces
        if: always() && startsWith(matrix.cell, 'win-')
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          output = Path('probe-logs/console-lifecycle')
          output.mkdir(parents=True, exist_ok=True)
          # Include both normal suite invocations; evidence ownership: PRD 32.
          for index, source in enumerate(Path('target/conhost-research').glob('*/result.console-trace')):
              if index >= 8 or source.stat().st_size > 256 * 1024:
                  raise SystemExit('console lifecycle trace exceeded its evidence bound')
              (output / f'{source.parent.name}.log').write_bytes(source.read_bytes())
          PY

      # Same rationale as local-artifact-probe.yml: a hang shows up as
      # `cancelled`, not `failure`, and `failure()` alone misses it.
      - name: Upload failure logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crosscheck-logs-${{ matrix.cell }}
          path: |
            probe-logs
            !probe-logs/windows-cookie-lifetime/**
            !probe-logs/native-auth-context/**/manifest.private.json
            !probe-logs/native-auth-context/**/native-profile-locator.private.json
            !probe-logs/native-auth-context/**/profiles/**
            !probe-logs/native-auth-context/**/ordinary-profile/**
            !probe-logs/native-auth-context/**/config/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload public Windows lifetime diagnostic receipts
        if: always() && inputs.windows_cookie_lifetime_contrast && matrix.cell == 'win-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cookie-lifetime-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          # No blanket output upload: private manifest/locator/UDF, Cargo
          # output and the pinned image are intentionally outside this list.
          path: |
            probe-logs/windows-cookie-lifetime/build-driver-receipt.json
            probe-logs/windows-cookie-lifetime/build-receipt.json
            probe-logs/windows-cookie-lifetime/protocol.log
            probe-logs/windows-cookie-lifetime/protocol/protocol-guard-receipt.json
            probe-logs/windows-cookie-lifetime/protocol/protocol-red-*.log
            probe-logs/windows-cookie-lifetime/protocol/protocol-restored.log
            probe-logs/windows-cookie-lifetime/protocol/restored/protocol-selfcheck-receipt.json
            probe-logs/windows-cookie-lifetime/strict-example-tests.log
            probe-logs/windows-cookie-lifetime/dedicated-build.log
            probe-logs/windows-cookie-lifetime/comparison.log
            probe-logs/windows-cookie-lifetime/comparison/lifetime-comparison-receipt.json
            probe-logs/windows-cookie-lifetime/comparison/*/receipt.json
            probe-logs/windows-cookie-lifetime/comparison/*/native-driver-receipt.json
            probe-logs/windows-cookie-lifetime/comparison/*/fixture-receipt.json
            probe-logs/windows-cookie-lifetime/comparison/*/windows-cookie-diagnostics.json
            probe-logs/windows-cookie-lifetime/comparison/*/driver.stdout.log
            probe-logs/windows-cookie-lifetime/comparison/*/driver.stderr.log
          if-no-files-found: ignore
          retention-days: 14

      # Runs on every outcome, including success: the receipt is the point.
      # A green run's per-suite results and per-cell timings are exactly what
      # a cost or gate analysis needs, and the failure-log step above never
      # produces them (that gap is why a passing run used to leave nothing).
      - name: Upload test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crosscheck-receipt-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: |
            probe-logs/test-receipt.json
            probe-logs/standard-workspace-receipt.json
            probe-logs/standard-workspace-test.log
            probe-logs/profile-key-handoff.json
            probe-logs/browser-workspace-test.log
            probe-logs/control-shutdown-response.log
            probe-logs/macos-snap-half-driver.log
            probe-logs/macos-snap-half/
            probe-logs/minicon-auth-presentation.log
            probe-logs/minicon-auth-settings.log
            probe-logs/minicon-account-presentation.log
            probe-logs/minicon-harness-cached.log
            probe-logs/minicon-harness-cached-public.log
            probe-logs/minicon-web-context.log
            probe-logs/minicon-web-process-selector.log
            probe-logs/minicon-web-native-profile.log
            probe-logs/minicon-harness-workspace.log
            probe-logs/minicon-workspace-geometry.log
            probe-logs/minicon-control-pending.log
            probe-logs/minicon-harness-workspace-public.log
            probe-logs/minicon-browser-process.log
            probe-logs/minicon-web-process-native.log
            probe-logs/retained-group/
            probe-logs/private-publication/
            probe-logs/console-lifecycle/
            probe-logs/browser-workspace/
            probe-logs/native-auth-context/qualification-receipt.json
            probe-logs/native-auth-context/helper-release-controls.json
            probe-logs/native-auth-context/helper-release-*.log
            probe-logs/native-auth-context/acl-contrast-receipt.json
            probe-logs/native-auth-context/protocol.log
            probe-logs/native-auth-context/protocol/
            probe-logs/native-auth-context/*-build.log
            probe-logs/native-auth-context/*-build-receipt.json
            probe-logs/native-auth-context/*-run.log
            probe-logs/native-auth-context/*/receipt.json
            probe-logs/native-auth-context/*/fixture-receipt.json
            probe-logs/native-auth-context/*/native-driver-receipt.json
            probe-logs/native-auth-context/*/windows-cookie-diagnostics.json
            probe-logs/native-auth-context/*/driver.*.log
            !probe-logs/native-auth-context/**/native-profile-locator.private.json
          if-no-files-found: ignore
          retention-days: 14
