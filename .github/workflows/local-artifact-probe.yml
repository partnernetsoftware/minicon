name: local-artifact-probe

# Experiment (0.1.23): how long does a GitHub round cost when CI only runs
# binaries that were cross-compiled on the developer's Mac? No toolchain, no
# checkout, no build -- download one test executable and run it. The numbers
# it prints decide whether "CI is only the seal" can lean on GitHub for the
# environments the Mac cannot host.
on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: Prerelease tag holding the prebuilt test executables
        required: true
      cells:
        description: Space-separated cells to run; empty runs every cell
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    # A job-level `if` cannot read `matrix`, and a job that exists at all can
    # queue: macos-13 sits queued for many minutes and would hold a caller's
    # round open. So the matrix itself is built from the requested cells.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {
              "lnx-x86_64": "ubuntu-24.04",
              "lnx-aarch64": "ubuntu-24.04-arm",
              "win-x86_64": "windows-2025",
              "win-aarch64": "windows-11-arm",
              "osx-aarch64": "macos-15",
              "osx-x86_64": "macos-13",
          }
          wanted = os.environ.get("CELLS", "").split() or list(runners)
          unknown = [c for c in wanted if c not in runners]
          if unknown:
              raise SystemExit(f"unknown cells: {unknown}")
          include = [{"cell": c, "runner": runners[c]} for c in wanted]
          print("matrix=" + json.dumps({"include": include}))
          PY

  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download and run the prebuilt test executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          started=$(date +%s)
          echo "job started at $(date -u +%FT%TZ)"
          gh release download "${{ inputs.bundle_tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.cell }}-*" --dir bundle
          downloaded=$(date +%s)
          chmod +x bundle/* || true
          # The product binary is not a suite: the black-box tests spawn it,
          # and `MINICON_TEST_BINARY` is the supported way to say where it is
          # (the default guess is a sibling of cargo's `deps/`, which does not
          # exist here). Exporting it for every cell is harmless where no suite
          # reads it.
          product="bundle/${{ matrix.cell }}-minicon"
          [ -f "$product.exe" ] && product="$product.exe"
          if [ -f "$product" ]; then
            export MINICON_TEST_BINARY="$PWD/$product"
            echo "product binary: $MINICON_TEST_BINARY"
          fi
          # Every suite runs, then the job fails. Under `set -e` the first
          # red suite ended the job and the rest were never attempted, so a
          # round answered one question per 45 minutes and a backlog could
          # hide behind whichever suite sorted first.
          failed=""
          for exe in bundle/${{ matrix.cell }}-*; do
            case "$exe" in *-minicon|*-minicon.exe) continue ;; esac
            echo "== $exe"
            if "$exe" --test-threads 2; then :; else failed="$failed $exe"; fi
          done
          finished=$(date +%s)
          echo "PROBE cell=${{ matrix.cell }} runner=${{ matrix.runner }} download=$((downloaded-started))s run=$((finished-downloaded))s total=$((finished-started))s"
          if [ -n "$failed" ]; then
            echo "PROBE failed suites:$failed"
            exit 1
          fi
