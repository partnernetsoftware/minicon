name: local-artifact-probe

# Experiment (0.1.23): how long does a GitHub round cost when CI only runs
# binaries that were cross-compiled on the developer's Mac? No toolchain, no
# checkout, no build -- download one test executable and run it. The numbers
# it prints decide whether "CI is only the seal" can lean on GitHub for the
# environments the Mac cannot host.
on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: Prerelease tag holding the prebuilt test executables
        required: true
      cells:
        description: Space-separated cells to run; empty runs every cell
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    # A job-level `if` cannot read `matrix`, and a job that exists at all can
    # queue: macos-13 sits queued for many minutes and would hold a caller's
    # round open. So the matrix itself is built from the requested cells.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {
              "lnx-x86_64": "ubuntu-24.04",
              "lnx-aarch64": "ubuntu-24.04-arm",
              "win-x86_64": "windows-2025",
              "win-aarch64": "windows-11-arm",
              "osx-aarch64": "macos-15",
              "osx-x86_64": "macos-13",
          }
          wanted = os.environ.get("CELLS", "").split() or list(runners)
          unknown = [c for c in wanted if c not in runners]
          if unknown:
              raise SystemExit(f"unknown cells: {unknown}")
          include = [{"cell": c, "runner": runners[c]} for c in wanted]
          print("matrix=" + json.dumps({"include": include}))
          PY

  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      # MiniCon is a windowed terminal, and a hosted Linux runner has no
      # display. Without one, 23 of 28 black-box tests and 9 of 11 control
      # tests fail on "screenshots were not written" -- a wall of red that
      # says only that nobody was there to draw on (run 36000799948). The
      # Windows runners have a real desktop and need nothing here.
      - name: Give Linux a display to draw on
        if: startsWith(matrix.cell, 'lnx-')
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Give the server a moment to accept connections before any test
          # tries to open a window against it.
          for _ in $(seq 20); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          DISPLAY=:99 xdpyinfo | head -3

      - name: Download and run the prebuilt test executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          started=$(date +%s)
          echo "job started at $(date -u +%FT%TZ)"
          gh release download "${{ inputs.bundle_tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.cell }}-*" --dir bundle
          downloaded=$(date +%s)
          chmod +x bundle/* || true
          # The product binary is not a suite: the black-box tests spawn it,
          # and `MINICON_TEST_BINARY` is the supported way to say where it is
          # (the default guess is a sibling of cargo's `deps/`, which does not
          # exist here). Exporting it for every cell is harmless where no suite
          # reads it.
          product="bundle/${{ matrix.cell }}-minicon"
          [ -f "$product.exe" ] && product="$product.exe"
          if [ -f "$product" ]; then
            # A native path, not this shell's. The suites spawn the binary
            # either way, but `minicon_console_agent` compares it against
            # PowerShell's `$_.Path` to find the session's own processes, and
            # `/d/a/...` never equals `D:\a\...`. That comparison silently
            # found nothing and the teardown test reported the host and agent
            # as never started (run 35993158583).
            if command -v cygpath >/dev/null; then
              MINICON_TEST_BINARY="$(cygpath -w "$PWD/$product")"
            else
              MINICON_TEST_BINARY="$PWD/$product"
            fi
            export MINICON_TEST_BINARY
            echo "product binary: $MINICON_TEST_BINARY"
          fi
          # Every suite runs, then the job fails. Under `set -e` the first
          # red suite ended the job and the rest were never attempted, so a
          # round answered one question per 45 minutes and a backlog could
          # hide behind whichever suite sorted first.
          failed=""
          probe="bundle/${{ matrix.cell }}-buffer-dump-probe.ps1"
          if [ -f "$probe" ]; then
            if command -v cygpath >/dev/null; then
              MINICON_BUFFER_DUMP_PROBE="$(cygpath -w "$PWD/$probe")"
            else
              MINICON_BUFFER_DUMP_PROBE="$PWD/$probe"
            fi
            export MINICON_BUFFER_DUMP_PROBE
            echo "buffer-dump probe: $MINICON_BUFFER_DUMP_PROBE"
          fi
          for exe in bundle/${{ matrix.cell }}-*; do
            case "$exe" in *-minicon|*-minicon.exe|*.ps1) continue ;; esac
            # The throughput journey is `#[ignore]`d because it owns a
            # machine for a minute; a runner is exactly where it should run.
            case "$exe" in
              *-minicon_throughput|*-minicon_throughput.exe) extra="--include-ignored --nocapture" ;;
              *) extra= ;;
            esac
            echo "== $exe $extra"
            if "$exe" --test-threads 2 $extra; then :; else failed="$failed $exe"; fi
          done
          finished=$(date +%s)
          echo "PROBE cell=${{ matrix.cell }} runner=${{ matrix.runner }} download=$((downloaded-started))s run=$((finished-downloaded))s total=$((finished-started))s"
          if [ -n "$failed" ]; then
            echo "PROBE failed suites:$failed"
            exit 1
          fi
