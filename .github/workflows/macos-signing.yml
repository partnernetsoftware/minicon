name: macOS Signing Court

# Signs and notarizes the macOS universal binary with the company Developer ID
# Application certificate, builds a stapled .dmg, and writes an exact-byte
# receipt. This is the macOS counterpart of company-signing.yml (Windows /
# Azure); the two providers and their switches are deliberately independent.
#
# Credentials live in the release-signing Environment:
#   secrets  MACOS_CERT_P12_BASE64  MACOS_CERT_P12_PASSWORD
#            ASC_API_KEY_P8_BASE64  ASC_API_KEY_ID  ASC_API_ISSUER_ID
#   variable MACOS_SIGN_IDENTITY  (the Developer ID Application common name)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character current main HEAD
        required: true
        type: string
      minicon_com_run_id:
        description: Successful unsigned one-pack/six-cell run for source_sha
        required: true
        type: string
      qualification_only:
        description: Sign and notarize exact bytes for provider qualification; never Candidate-eligible
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: minicon-macos-signing-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upstream_attempt: ${{ steps.identity.outputs.upstream_attempt }}
      payload_artifact: ${{ steps.identity.outputs.payload_artifact }}
      version: ${{ steps.identity.outputs.version }}
      release_eligible: ${{ steps.identity.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Bind exact source and unsigned one-pack run
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          [[ "$(jq -r .path <<<"$run")" == ".github/workflows/minicon-com.yml" ]]
          [[ "$(jq -r .event <<<"$run")" == "workflow_dispatch" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$run")" == "$SOURCE_SHA" ]]
          attempt="$(jq -r .run_attempt <<<"$run")"
          echo "upstream_attempt=$attempt" >>"$GITHUB_OUTPUT"
          echo "payload_artifact=minicon-native-payloads" >>"$GITHUB_OUTPUT"
          version="$(jq -r .version release-policy.json)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          [[ "$(jq -r .schema release-policy.json)" == 1 ]]
          [[ "$(jq -r .version release-policy.json)" == "$version" ]]
          # macOS signing is an independent switch from the Windows signing.mode.
          macos_mode="$(jq -r '.signing.macos.mode // "off"' release-policy.json)"
          [[ "$macos_mode" == off || "$macos_mode" == required ]]
          if [[ "$QUALIFICATION_ONLY" == true ]]; then
            release_eligible=false
          else
            # A release-eligible signature must be for an unpublished version.
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "release-eligible signing requires an unpublished version" >&2
              exit 1
            fi
            release_eligible=true
          fi
          echo "release_eligible=$release_eligible" >>"$GITHUB_OUTPUT"

  sign:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-signing
    outputs:
      universal_after_sha256: ${{ steps.receipt.outputs.universal_after_sha256 }}
      dmg_sha256: ${{ steps.receipt.outputs.dmg_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download exact unsigned native payloads
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          PAYLOAD_ARTIFACT: ${{ needs.preflight.outputs.payload_artifact }}
        run: |
          set -euo pipefail
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PAYLOAD_ARTIFACT" --dir upstream

      - name: Verify unsigned osx cells and assemble the universal binary
        run: |
          set -euo pipefail
          receipt=upstream/build-receipt.json
          verify_cell() {
            cell="$1"; path="$2"
            expected="$(jq -r --arg cell "$cell" '.payloads[$cell].sha256' "$receipt")"
            actual="$(shasum -a 256 "$path" | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]] || { echo "unsigned $cell digest drift" >&2; exit 1; }
          }
          arm=upstream/cells/osx-aarch64/minicon
          intel=upstream/cells/osx-x86_64/minicon
          verify_cell osx-aarch64 "$arm"
          verify_cell osx-x86_64 "$intel"
          mkdir -p work
          lipo -create -output work/minicon "$arm" "$intel"
          [[ "$(lipo -archs work/minicon)" == *arm64* ]]
          [[ "$(lipo -archs work/minicon)" == *x86_64* ]]
          # The unsigned universal binary before any Developer ID signature.
          shasum -a 256 work/minicon | cut -d' ' -f1 > work/before_sha256.txt
          echo "before: $(cat work/before_sha256.txt)"

      - name: Import the Developer ID identity into a throwaway keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/minicon-signing.keychain-db"
          kcpw="$(openssl rand -hex 20)"
          echo "SIGN_KEYCHAIN=$kc" >>"$GITHUB_ENV"
          # Record for teardown even if a later step fails.
          echo "$kc" > "$RUNNER_TEMP/keychain-path"
          p12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -d > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$MACOS_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # Consult this keychain first without discarding the runner defaults.
          # shellcheck disable=SC2046  # intentional split: each path is one arg
          security list-keychains -d user -s "$kc" \
            $(security list-keychains -d user | sed 's/"//g' | xargs)
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"

      - name: Sign the universal binary (hardened runtime + secure timestamp)
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" work/minicon
          codesign --verify --strict --verbose=2 work/minicon
          codesign -dv --verbose=2 work/minicon 2>&1 | grep -q "TeamIdentifier=L2N7M5M544"
          codesign -dv --verbose=2 work/minicon 2>&1 | grep -q "flags=.*runtime"

      - name: Notarize the signed binary
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d > "$p8"
          trap 'rm -f "$p8"' EXIT
          ditto -c -k --keepParent work/minicon work/minicon.zip
          out="$(xcrun notarytool submit work/minicon.zip \
            --key "$p8" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
            --wait --output-format json)"
          echo "$out"
          [[ "$(jq -r .status <<<"$out")" == "Accepted" ]]
          jq -r .id <<<"$out" > work/bin_notary_id.txt

      - name: Build, sign, notarize and staple the .dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d > "$p8"
          trap 'rm -f "$p8"' EXIT
          mkdir -p work/dmgroot
          # A bare Mach-O cannot be stapled (Error 73) and Gatekeeper's GUI
          # launch path rejects it as "does not seem to be an app" even from
          # inside a stapled .dmg, so the double-clickable deliverable must be a
          # bundle. The tar.gz keeps shipping the bare signed binary for
          # command-line use. See sign-macos-artifacts skill, references §6.
          app="work/MiniCon.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp work/minicon "$app/Contents/MacOS/minicon"
          # The icon must be inside the bundle before codesign runs: the seal
          # covers Contents/Resources, so adding it afterwards would leave the
          # signature disagreeing with the contents. Without it the Dock shows
          # the generic blank-document tile. Regenerate with
          # assets/icon/generate_icons.py; see assets/icon/README.md.
          cp assets/minicon.icns "$app/Contents/Resources/minicon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MiniCon</string>
            <key>CFBundleDisplayName</key><string>MiniCon</string>
            <key>CFBundleIdentifier</key><string>com.partnernetsoftware.minicon</string>
            <key>CFBundleExecutable</key><string>minicon</string>
            <key>CFBundleIconFile</key><string>minicon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          # Prove the icon is in place and declared before anything is sealed.
          [[ -s "$app/Contents/Resources/minicon.icns" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            "$app/Contents/Info.plist")" == minicon ]]
          # Sign inner-out: the executable first, then the bundle.
          codesign --force --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$app/Contents/MacOS/minicon"
          codesign --force --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" work/app.zip
          out="$(xcrun notarytool submit work/app.zip \
            --key "$p8" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
            --wait --output-format json)"
          echo "$out"
          [[ "$(jq -r .status <<<"$out")" == "Accepted" ]]
          jq -r .id <<<"$out" > work/app_notary_id.txt
          rm -f work/app.zip
          # Staple the .app itself (bundles are staplable), then prove the gate
          # the bare binary can never pass.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -t exec -vv "$app" 2>&1 | grep -q "accepted"
          spctl -a -t exec -vv "$app" 2>&1 | grep -q "source=Notarized Developer ID"
          cp -R "$app" work/dmgroot/MiniCon.app
          dmg="work/minicon-$VERSION-macos-universal.dmg"
          hdiutil create -volname "MiniCon" -srcfolder work/dmgroot -ov -format UDZO "$dmg"
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          out="$(xcrun notarytool submit "$dmg" \
            --key "$p8" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
            --wait --output-format json)"
          echo "$out"
          [[ "$(jq -r .status <<<"$out")" == "Accepted" ]]
          jq -r .id <<<"$out" > work/dmg_notary_id.txt
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg" 2>&1 | grep -q "accepted"
          cp "$dmg" "work/minicon-macos-universal.dmg"

      - name: Write the macOS signing receipt
        id: receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.minicon_com_run_id }}
          UPSTREAM_ATTEMPT: ${{ needs.preflight.outputs.upstream_attempt }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_ELIGIBLE: ${{ needs.preflight.outputs.release_eligible }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          before="$(cat work/before_sha256.txt)"
          after="$(shasum -a 256 work/minicon | cut -d' ' -f1)"
          dmg_sha="$(shasum -a 256 work/minicon-macos-universal.dmg | cut -d' ' -f1)"
          team="$(codesign -dv --verbose=2 work/minicon 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          spctl_dmg="$(spctl -a -t open --context context:primary-signature -vv work/minicon-macos-universal.dmg 2>&1 | sed -n 's/^work.*: //p' | head -1)"
          spctl_app="$(spctl -a -t exec -vv work/MiniCon.app 2>&1 | sed -n 's/^work.*: //p' | head -1)"
          mkdir -p signed
          cp work/minicon signed/minicon
          cp work/minicon-macos-universal.dmg "signed/minicon-$VERSION-macos-universal.dmg"
          python3 - <<PY
          import json
          receipt = {
            "schema": 2,
            "kind": "minicon-macos-signing-court",
            "source_sha": "$SOURCE_SHA",
            "minicon_com_run": {"id": int("$UPSTREAM_RUN_ID"), "attempt": int("$UPSTREAM_ATTEMPT")},
            "version": "$VERSION",
            "provider": "Apple Developer ID + notarization",
            "identity": "$MACOS_SIGN_IDENTITY",
            "team_identifier": "$team",
            "assets": {
              "macos-universal": {
                "before_sha256": "$before",
                "after_sha256": "$after",
                "notarization_id": open("work/bin_notary_id.txt").read().strip(),
                "hardened_runtime": True,
                "stapled": False,
              },
              "macos-universal-dmg": {
                "sha256": "$dmg_sha",
                "notarization_id": open("work/dmg_notary_id.txt").read().strip(),
                "stapled": True,
                "spctl": "$spctl_dmg",
              },
              # The bundle the .dmg carries: unlike the bare Mach-O this one is
              # staplable and passes `spctl -t exec`, which is what makes a
              # plain double-click open without a Gatekeeper warning.
              "macos-universal-app": {
                "notarization_id": open("work/app_notary_id.txt").read().strip(),
                "hardened_runtime": True,
                "stapled": True,
                "spctl": "$spctl_app",
              },
            },
            "release_eligible": ("$RELEASE_ELIGIBLE" == "true"),
          }
          json.dump(receipt, open("signed/macos-signing-receipt.json", "w"), indent=2)
          print(json.dumps(receipt, indent=2))
          PY
          echo "universal_after_sha256=$after" >>"$GITHUB_OUTPUT"
          echo "dmg_sha256=$dmg_sha" >>"$GITHUB_OUTPUT"

      - name: Upload signed macOS artifacts and receipt
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-minicon
          path: signed/
          if-no-files-found: error
          retention-days: 7

      - name: Tear down the signing keychain
        if: always()
        run: |
          kc="$(cat "$RUNNER_TEMP/keychain-path" 2>/dev/null || true)"
          [ -n "$kc" ] && security delete-keychain "$kc" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/asc_api_key.p8" 2>/dev/null || true
