# One macOS job packs the per-cell .com set; six native runners only execute
# their own artifact. Never cargo/checkout on the test matrix. v0.2.27: no
# cosmocc anywhere in this workflow.
name: minicon.com

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minicon-com
  cancel-in-progress: false

env:
  CARGO_ZIGBUILD_VERSION: "0.23.2"
  CARGO_XWIN_VERSION: "0.23.1"
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"

jobs:
  linux-browser-helpers:
    name: native browser helper (${{ matrix.cell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: lnx-x86_64, runner: ubuntu-24.04}
          - {cell: lnx-aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: browser-helper-${{ matrix.cell }}-${{ hashFiles('Cargo.lock', 'crates/minicon-web/**') }}
          restore-keys: browser-helper-${{ matrix.cell }}-
      - name: Provision WebKitGTK build dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.cell }}' == lnx-x86_64 ]]; then
            sudo python3 - <<'PY'
          import re
          from pathlib import Path
          for path in (Path('/etc/apt/sources.list.d/ubuntu.sources'), Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')):
              if not path.is_file():
                  continue
              original = path.read_bytes()
              updated = re.sub(rb'(?<=://)azure\.archive\.ubuntu\.com(?=[:/\s]|$)', b'archive.ubuntu.com', original)
              if updated != original:
                  path.write_bytes(updated)
                  print('Ubuntu mirror: azure.archive.ubuntu.com -> archive.ubuntu.com')
          PY
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build exact-source WebKitGTK adapter
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="--remap-path-prefix=$HOME=~" cargo build --locked --release -p minicon-web --features wry-host --bin minicon-web-host
          mkdir -p helper
          cp target/release/minicon-web-host helper/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          binary = Path('helper/minicon-web-host')
          raw = binary.read_bytes()
          expected_machine = 62 if '${{ matrix.cell }}' == 'lnx-x86_64' else 183
          assert 64 <= len(raw) <= 32 * 1024 * 1024
          assert raw[:7] == b'\x7fELF\x02\x01\x01'
          assert int.from_bytes(raw[18:20], 'little') == expected_machine
          Path('helper/receipt.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'],
              'cell': '${{ matrix.cell }}',
              'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'bytes': binary.stat().st_size,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-helper-${{ matrix.cell }}
          path: helper/
          if-no-files-found: error
          retention-days: 14

  build:
    name: pack once (macos-15)
    needs: linux-browser-helpers
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      minicon_com_sha256: ${{ steps.pack.outputs.minicon_com_sha256 }}
      source_sha: ${{ steps.pack.outputs.source_sha }}
      source_tree_digest: ${{ steps.pack.outputs.source_tree_digest }}
      artifact_id: ${{ steps.upload_com.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/zig-0.16.0
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/cargo-xwin
            ~/minicon-cargo-tools
            loader/payload-build
          key: minicon-com-payloads-v2-${{ env.ZIG_VERSION }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ env.CARGO_XWIN_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'build.rs', 'src/**', 'crates/**', 'loader/rebuild-payloads.sh') }}
          restore-keys: |
            minicon-com-payloads-v2-${{ env.ZIG_VERSION }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ env.CARGO_XWIN_VERSION }}-
            minicon-com-payloads-${{ env.ZIG_VERSION }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ env.CARGO_XWIN_VERSION }}-
            minicon-com-payloads-${{ env.ZIG_VERSION }}-

      - name: Toolchain
        run: |
          set -euo pipefail
          ZIG_HOME=""
          ZIG_HOME=$(bash loader/install-zig.sh)
          echo "$ZIG_HOME" >> "$GITHUB_PATH"
          export PATH="$ZIG_HOME:$PATH"
          test "$(zig version)" = "$ZIG_VERSION"
          brew list llvm >/dev/null 2>&1 || brew install llvm
          LLVM_HOME=""
          LLVM_HOME=$(brew --prefix llvm)
          echo "$LLVM_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$LLVM_HOME/bin:$PATH"
          command -v llvm-rc
          mkdir -p "$HOME/minicon-cargo-tools/bin"
          echo "$HOME/minicon-cargo-tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/minicon-cargo-tools/bin:$PATH"
          cargo install --root "$HOME/minicon-cargo-tools" cargo-zigbuild \
            --locked --version "$CARGO_ZIGBUILD_VERSION"
          cargo install --root "$HOME/minicon-cargo-tools" cargo-xwin \
            --locked --version "$CARGO_XWIN_VERSION"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: browser-helper-*
          path: target/browser-helpers-download
      - name: Verify native helper identities
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          for cell in ('lnx-x86_64', 'lnx-aarch64'):
              root = Path('target/browser-helpers-download') / f'browser-helper-{cell}'
              receipt = json.loads((root / 'receipt.json').read_text())
              binary = root / 'minicon-web-host'
              assert receipt['source_sha'] == os.environ['GITHUB_SHA']
              assert receipt['cell'] == cell
              assert receipt['sha256'] == hashlib.sha256(binary.read_bytes()).hexdigest()
              assert receipt['bytes'] == binary.stat().st_size
              raw = binary.read_bytes()
              assert 64 <= len(raw) <= 32 * 1024 * 1024
              assert raw[:7] == b'\x7fELF\x02\x01\x01'
              assert int.from_bytes(raw[18:20], 'little') == (62 if cell == 'lnx-x86_64' else 183)
              destination = Path('target/browser-helpers') / cell
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(binary, destination / 'minicon-web-host')
              shutil.copy2(root / 'receipt.json', destination / 'receipt.json')
          PY

      - name: Pack the per-cell .com set (cosmocc-free)
        id: pack
        run: |
          set -euo pipefail
          # v0.2.27: the cosmocc polyglot lane is retired from the build. The
          # courts that used to guard loader.c run against the real packed
          # artifacts instead (loader/rust-lane-courts.sh).
          rust_courts="$RUNNER_TEMP/rust-lane-courts.log"
          bash bx/scripts/test.sh
          bash loader/rebuild-payloads.sh
          bash loader/pack-rust-all.sh
          bash bx/scripts/build-cells.sh
          court_cell="lnx-x86_64"
          if [[ "$(uname -s)" == Darwin* ]]; then court_cell="osx-aarch64"; fi
          MINICON_RUST_COURT_COM="loader/dist/rust/minicon-bx-$court_cell.com" \
            bash loader/rust-lane-courts.sh | tee "$rust_courts"
          grep -q "rust-lane-courts: .* 0 failed" "$rust_courts"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          log = (root / "rust-lane-courts.log").read_bytes()
          receipt = {
              "schema": 1,
              "kind": "minicon-rust-lane-courts",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job_status": "success",
              "courts": {"rust_lane": "9 passed, 0 failed"},
              "logs": {"rust-lane-courts.log": {"bytes": len(log), "sha256": hashlib.sha256(log).hexdigest()}},
          }
          (root / "rust-lane-courts-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("loader/dist/rust")
          artifacts = {}
          for path in sorted(root.glob("*.com")):
              raw = path.read_bytes()
              artifacts[path.name] = {
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              }
          if len(artifacts) != 12:
              raise SystemExit(f"expected six minicon + six bx artifacts, found {len(artifacts)}")
          (root / "manifest.json").write_text(
              json.dumps({"schema": 1, "artifacts": artifacts}, indent=2) + "\n"
          )
          PY
          mkdir -p loader/dist/courts
          cp "$RUNNER_TEMP/rust-lane-courts-receipt.json" loader/dist/courts/
          python3 loader/write-build-receipt.py
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          rec = json.loads(Path("loader/dist/build-receipt.json").read_text())
          rec["lane"] = "github-ci"
          rec["builder"] = "macos-15"
          rec["run_id"] = os.environ["GITHUB_RUN_ID"]
          rec["run_attempt"] = int(os.environ["GITHUB_RUN_ATTEMPT"])
          if rec.get("source_dirty"):
              raise SystemExit("github-ci pack requires source_dirty=false")
          if not rec.get("source_tree_digest"):
              raise SystemExit("missing source_tree_digest")
          if not rec.get("rust_coms") or len(rec["rust_coms"]) != 12:
              raise SystemExit("build receipt lacks the 12 rust_coms digests")
          courts_path = Path("loader/dist/courts/rust-lane-courts-receipt.json")
          courts = json.loads(courts_path.read_text())
          if courts.get("source_sha") != rec["source_sha"] or courts.get("job_status") != "success":
              raise SystemExit("rust-lane courts receipt identity/status mismatch")
          rec["courts"] = {
              "receipt": "courts/rust-lane-courts-receipt.json",
              "sha256": hashlib.sha256(courts_path.read_bytes()).hexdigest(),
              "summary": courts["courts"],
          }
          Path("loader/dist/build-receipt.json").write_text(json.dumps(rec, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"minicon_com_sha256={rec['rust_coms']['minicon-win-x86_64.com']['sha256']}\n")
              fh.write(f"source_sha={rec['source_sha']}\n")
              fh.write(f"source_tree_digest={rec['source_tree_digest']}\n")
          PY

      - name: Stage flat artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -R loader/dist/rust artifact/
          cp loader/dist/build-receipt.json artifact/
          cp bx/tools/verify.bxs bx/tools/wasm-diff.bxs artifact/
          cp loader/ci-status.sh artifact/
          cp loader/ci-status.ps1 artifact/
          cp loader/ci-control.sh artifact/
          cp loader/ci-control.ps1 artifact/
          cp scripts/browser-workspace-smoke.py artifact/
          cp -R loader/dist/courts artifact/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload_com
        with:
          name: minicon-com
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Stage six native payloads for Release packaging
        run: |
          set -euo pipefail
          mkdir -p native-payloads
          cp -R loader/dist/cells native-payloads/
          cp loader/dist/build-receipt.json native-payloads/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minicon-native-payloads
          path: native-payloads/
          if-no-files-found: error
          retention-days: 14

  test:
    name: ${{ matrix.cell }}
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: lnx-x86_64, runner: ubuntu-24.04, family: linux, expected_os: Linux, expected_arch: X64}
          - {cell: lnx-aarch64, runner: ubuntu-24.04-arm, family: linux, expected_os: Linux, expected_arch: ARM64}
          - {cell: win-x86_64, runner: windows-2025, family: windows, expected_os: Windows, expected_arch: X64}
          - {cell: win-aarch64, runner: windows-11-arm, family: windows, expected_os: Windows, expected_arch: ARM64}
          - {cell: osx-x86_64, runner: macos-15-intel, family: macos, expected_os: macOS, expected_arch: X64}
          - {cell: osx-aarch64, runner: macos-15, family: macos, expected_os: macOS, expected_arch: ARM64}
    runs-on: ${{ matrix.runner }}
    env:
      CELL: ${{ matrix.cell }}
      FAMILY: ${{ matrix.family }}
      EXPECTED_RUNNER_OS: ${{ matrix.expected_os }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.expected_arch }}
      EXPECTED_COM_SHA256: ${{ needs.build.outputs.minicon_com_sha256 }}
      EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      EXPECTED_SOURCE_TREE_DIGEST: ${{ needs.build.outputs.source_tree_digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: minicon-com
          path: bundle

      - name: Guard runner identity (no compile)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          com="bundle/rust/minicon-$CELL.com"
          test -f "$com"
          test -f bundle/build-receipt.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          cell = os.environ["CELL"]
          com = Path(f"bundle/rust/minicon-{cell}.com")
          manifest = json.loads(Path("bundle/rust/manifest.json").read_text())
          entry = manifest["artifacts"][com.name]
          raw = com.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == entry["sha256"]
          assert len(raw) == entry["bytes"]
          rec = json.load(open("bundle/build-receipt.json", encoding="utf-8"))
          assert rec["rust_coms"][com.name]["sha256"] == entry["sha256"]
          assert rec["source_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert rec.get("source_dirty") is False
          assert rec["source_tree_digest"] == os.environ["EXPECTED_SOURCE_TREE_DIGEST"]
          PY

      - name: Extract and verify the exact native browser artifact (no compile)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct
          from pathlib import Path
          receipt = json.loads(Path('bundle/build-receipt.json').read_text())
          cell = os.environ['CELL']
          filename = 'minicon.exe' if os.environ['FAMILY'] == 'windows' else 'minicon'
          # The cell rides inside this cell's own .com container (first table
          # entry before __meta__); the cosmocc ZipOS overlay is gone.
          raw_com = Path(f'bundle/rust/minicon-{cell}.com').read_bytes()
          i = raw_com.rfind(b'MINICOM1')
          assert i > 0, 'no MINICOM1 footer'
          table_off, table_len = struct.unpack('<QQ', raw_com[i + 8:i + 24])
          assert table_off + table_len == i, 'dangling footer'
          key = cell.encode().ljust(32, b'\0')
          slot = raw_com[table_off:table_off + table_len]
          entry_index = None
          for n in range(0, len(slot), 48):
            if slot[n:n + 32] == key:
              entry_index = n
              break
          assert entry_index is not None, f'cell {cell} missing from container'
          off, ln = struct.unpack('<QQ', slot[entry_index + 32:entry_index + 48])
          raw = raw_com[off:off + ln]
          identity = receipt['payloads'][cell]
          assert hashlib.sha256(raw).hexdigest() == identity['sha256']
          assert len(raw) == identity['bytes']
          destination = Path('browser-native') / filename
          destination.parent.mkdir(exist_ok=True)
          destination.write_bytes(raw)
          destination.chmod(0o755)
          PY

      - name: version+passthrough+status (unix)
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          com="bundle/rust/minicon-$CELL.com"
          chmod +x bundle/ci-status.sh "$com"
          bundle/ci-status.sh "$FAMILY" "$com" bundle/build-receipt.json | tee runtime-body.log
          if [[ "$FAMILY" == linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libxkbcommon-x11-0 libgtk-3-0t64 libwebkit2gtk-4.1-0
            xvfb-run -a bash bundle/ci-control.sh "$com" | tee -a runtime-body.log
          else
            bash bundle/ci-control.sh "$com" | tee -a runtime-body.log
          fi

      - name: Native browser workspace (unix; no compile)
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FAMILY" == linux ]]; then
            xvfb-run -a python3 bundle/browser-workspace-smoke.py browser-native/minicon --output browser-workspace
          else
            python3 bundle/browser-workspace-smoke.py browser-native/minicon --output browser-workspace
          fi

      - name: Provision native WebView2 Runtime on the Windows court
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PRD 27: disposable court setup, never a bundled product runtime.
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue })
          if ($runtime.Count -eq 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Untrusted WebView2 installer' }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(240000)) { $process.Kill(); throw 'WebView2 installation timed out' }
            if ($process.ExitCode -ne 0) { throw "WebView2 installer exited $($process.ExitCode)" }
          }

      - name: version+passthrough+status (windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -LiteralPath "bundle/rust/minicon-$env:CELL.com" -Destination bundle/minicon-cell.exe
          & bundle/ci-status.ps1 -Binary (Join-Path $PWD 'bundle/minicon-cell.exe') `
            -Receipt (Join-Path $PWD 'bundle/build-receipt.json') *>&1 |
            Tee-Object -FilePath runtime-body.log
          & bundle/ci-control.ps1 -Binary (Join-Path $PWD 'bundle/minicon-cell.exe') *>&1 |
            Tee-Object -FilePath runtime-body.log -Append

      - name: Native browser workspace (windows; no compile)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          python bundle/browser-workspace-smoke.py browser-native/minicon.exe --output browser-workspace
          if ($LASTEXITCODE -ne 0) { throw 'Native browser workspace failed' }

      - name: Rust launcher lane (no compile, per-OS artifact)
        shell: bash
        run: |
          set -euo pipefail
          : > rust-lane.log
          src="bundle/rust/minicon-${CELL}.com"
          test -f "$src"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          cell = os.environ["CELL"]
          manifest = json.loads(Path("bundle/rust/manifest.json").read_text())
          entry = manifest["artifacts"][f"minicon-{cell}.com"]
          raw = Path(f"bundle/rust/minicon-{cell}.com").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == entry["sha256"]
          assert len(raw) == entry["bytes"]
          PY
          if [[ "$FAMILY" == "windows" ]]; then
            bin="rust-lane.exe"
          else
            bin="rust-lane.com"
          fi
          cp "$src" "$bin"
          if [[ "$FAMILY" != "windows" ]]; then chmod +x "$bin"; fi
          bin="./$bin"
          {
            "$bin" --version
            if "$bin" --definitely-not-a-flag; then
              echo "unknown flag must exit nonzero" >&2
              exit 1
            fi
            if [[ "$FAMILY" == "linux" ]]; then
              xvfb-run -a "$bin" --status
            else
              "$bin" --status
            fi
          } 2>&1 | tee -a rust-lane.log

      - name: bx lane (no compile, per-OS artifact)
        shell: bash
        run: |
          set -euo pipefail
          : > bx-lane.log
          src="bundle/rust/minicon-bx-${CELL}.com"
          test -f "$src"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          cell = os.environ["CELL"]
          manifest = json.loads(Path("bundle/rust/manifest.json").read_text())
          entry = manifest["artifacts"][f"minicon-bx-{cell}.com"]
          raw = Path(f"bundle/rust/minicon-bx-{cell}.com").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == entry["sha256"]
          assert len(raw) == entry["bytes"]
          PY
          if [[ "$FAMILY" == "windows" ]]; then
            bin="bx-lane.exe"
          else
            bin="bx-lane.com"
          fi
          cp "$src" "$bin"
          if [[ "$FAMILY" != "windows" ]]; then chmod +x "$bin"; fi
          bin="./$bin"
          {
            "$bin" version
            test "$("$bin" eval '6*7')" = "42"
            if "$bin" frobnicate; then
              echo "unknown command must exit nonzero" >&2
              exit 1
            fi
            # The bx-native verifier: CLI, check, budgets, stdin, patch, spawn.
            # verify.bxs + wasm-diff.bxs ship in the bundle; the matrix never
            # checks out, and verify.bxs reaches wasm-diff.bxs via __dir__.
            "$bin" test bundle/verify.bxs "$bin"
          } 2>&1 | tee -a bx-lane.log

      - name: Receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          build = json.loads(Path("bundle/build-receipt.json").read_text())
          log = Path("runtime-body.log")
          data = {
              "schema": 2,
              "lane": "github-ci",
              "cell": os.environ["CELL"],
              "job_status": os.environ["JOB_STATUS"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_sha": build["source_sha"],
              "source_dirty": build.get("source_dirty"),
              "source_tree_digest": build.get("source_tree_digest"),
              "rust_com_sha256": build["rust_coms"][f"minicon-{os.environ['CELL']}.com"]["sha256"],
              "product_version": build.get("product_version"),
          }
          if log.is_file():
              raw = log.read_bytes()
              data["log_sha256"] = hashlib.sha256(raw).hexdigest()
              data["log_bytes"] = len(raw)
          browser = Path('browser-workspace/receipt.json')
          if browser.is_file():
              raw = browser.read_bytes()
              journey = json.loads(raw)
              assert journey['binary_sha256'] == build['payloads'][os.environ['CELL']]['sha256']
              data['native_browser_sha256'] = journey['binary_sha256']
              data['native_browser_status'] = journey['status']
              data['native_browser_receipt_sha256'] = hashlib.sha256(raw).hexdigest()
          bx = Path('bx-lane.log')
          if bx.is_file():
              raw = bx.read_bytes()
              data['bx_lane'] = {
                  'status': 'passed' if os.environ['JOB_STATUS'] == 'success' else 'failed',
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
              }
          else:
              data['bx_lane'] = {'status': 'missing'}
          rust = Path('rust-lane.log')
          if rust.is_file():
              raw = rust.read_bytes()
              data['rust_lane'] = {
                  'status': 'passed' if os.environ['JOB_STATUS'] == 'success' else 'failed',
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
              }
          else:
              data['rust_lane'] = {'status': 'missing'}
          Path("runtime-receipt.json").write_text(json.dumps(data, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: minicon-com-runtime-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: |
            runtime-receipt.json
            runtime-body.log
            rust-lane.log
            bx-lane.log
            browser-workspace/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: require six unique PASS same digest
    if: always()
    needs: [build, test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Current attempt only. Re-run failed jobs is not enough; re-run all tests.
          pattern: minicon-com-runtime-*-attempt-${{ github.run_attempt }}
          path: receipts

      - name: All six cells succeeded with one identity
        env:
          EXPECTED_COM_SHA256: ${{ needs.build.outputs.minicon_com_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          EXPECTED_SOURCE_TREE_DIGEST: ${{ needs.build.outputs.source_tree_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          want_set = {"lnx-x86_64","lnx-aarch64","win-x86_64","win-aarch64","osx-x86_64","osx-aarch64"}
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          rows = []
          for path in Path("receipts").rglob("runtime-receipt.json"):
              rec = json.loads(path.read_text())
              if str(rec.get("run_id")) != run_id:
                  continue
              if int(rec.get("run_attempt", -1)) != attempt:
                  continue
              rows.append(rec)
          cells = [r["cell"] for r in rows]
          if len(cells) != 6 or set(cells) != want_set or len(set(cells)) != 6:
              print("cell set", cells, "n=", len(rows)); sys.exit(1)
          # Every cell executed its own artifact; all six digests must appear
          # exactly once and match the one-build receipt's manifest.
          coms = {r["cell"]: r["rust_com_sha256"] for r in rows}
          if len(coms) != 6 or any(not v for v in coms.values()):
              print("per-cell digest missing", coms); sys.exit(1)
          if {r["source_sha"] for r in rows} != {os.environ["EXPECTED_SOURCE_SHA"]}:
              print("source mismatch"); sys.exit(1)
          if any(r.get("source_dirty") for r in rows):
              print("source_dirty"); sys.exit(1)
          if {r.get("source_tree_digest") for r in rows} != {os.environ["EXPECTED_SOURCE_TREE_DIGEST"]}:
              print("source_tree_digest mismatch"); sys.exit(1)
          if {str(r["run_id"]) for r in rows} != {run_id}:
              print("run_id mismatch"); sys.exit(1)
          if any(int(r.get("run_attempt", -1)) != attempt for r in rows):
              print("run_attempt mismatch"); sys.exit(1)
          bad = [r for r in rows if r.get("job_status") != "success"]
          if bad:
              print("bad", bad); sys.exit(1)
          if any((r.get('bx_lane') or {}).get('status') != 'passed' for r in rows):
              print('missing bx lane evidence'); sys.exit(1)
          if any((r.get('rust_lane') or {}).get('status') != 'passed' for r in rows):
              print('missing rust launcher lane evidence'); sys.exit(1)
          # EXPECTED_COM_SHA256 now names the win-x86_64 .com (the primary
          # single-file asset); the aggregate receipt carries all six.
          if coms.get("win-x86_64") != os.environ["EXPECTED_COM_SHA256"]:
              print("primary .com digest mismatch"); sys.exit(1)
          if any(r.get('native_browser_status') != 'passed' or not r.get('native_browser_sha256')
                 or not r.get('native_browser_receipt_sha256') for r in rows):
              print('missing native browser qualification'); sys.exit(1)
          out = {
              "schema": 3,
              "kind": "minicon-six-cell-aggregate",
              "lane": "github-ci",
              "run_id": run_id,
              "run_attempt": attempt,
              "minicon_com_sha256": os.environ["EXPECTED_COM_SHA256"],
              "rust_coms": {f"minicon-{c}.com": {"sha256": d} for c, d in sorted(coms.items())},
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "source_dirty": False,
              "source_tree_digest": os.environ["EXPECTED_SOURCE_TREE_DIGEST"],
              "artifact_id": os.environ.get("EXPECTED_ARTIFACT_ID") or None,
              "cells": sorted(cells),
              "strategy": "current-attempt-only-full-six",
          }
          Path("aggregate-receipt.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: minicon-com-aggregate-attempt-${{ github.run_attempt }}
          path: aggregate-receipt.json
          if-no-files-found: ignore
          retention-days: 14
