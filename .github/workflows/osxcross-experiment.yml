# EXPERIMENTAL — not part of the release or test pipeline.
#
# Answers one narrow question, tracked as `[ ] BLOCKED` in
# prd/PRD_02_27_con_delivery.md ("non-Mac macOS cross-compile from a Linux
# CI/cloud host"): can a Linux runner alone (osxcross + a macOS SDK, no macOS
# runner at all) produce a real macOS Mach-O for MiniCon? This does NOT
# replace six-grid-cloud-build.yml, which already builds the macOS cells
# natively on macos-14/macos-13 runners — that path works today. This
# workflow only tests whether osxcross can additionally remove even that
# native-macOS-runner dependency. Manual trigger only; never runs on push,
# never feeds a Candidate, never gates anything.
name: osxcross experiment (non-Mac macOS cross-compile)

on:
  workflow_dispatch:
    inputs:
      target:
        description: macOS Rust target triple to attempt
        required: true
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        default: aarch64-apple-darwin

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ inputs.target }} via osxcross
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Fetch macOS SDK (phracker/MacOSX-SDKs, MacOSX11.3)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/phracker/MacOSX-SDKs.git /tmp/sdks
          tar -C /tmp/sdks -cJf /tmp/MacOSX11.3.sdk.tar.xz MacOSX11.3.sdk

      - name: Build osxcross toolchain
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tpoechtrager/osxcross.git /tmp/osxcross
          cp /tmp/MacOSX11.3.sdk.tar.xz /tmp/osxcross/tarballs/
          cd /tmp/osxcross
          UNATTENDED=1 ./build.sh

      - name: Install Rust target
        run: rustup target add "${{ inputs.target }}"

      - name: Cross-build minicon
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          export PATH="/tmp/osxcross/target/bin:$PATH"
          # osxcross names its wrappers <arch>-apple-darwin<ver>-clang, where
          # <arch> is arm64 (not aarch64) and <ver> tracks the SDK (darwin20.4
          # for SDK 11.3). It also ships a *-cmake-clang variant, so match the
          # plain wrapper exactly rather than globbing for "*-clang".
          case "$TARGET" in
            aarch64-apple-darwin) OSX_ARCH=arm64 ;;
            x86_64-apple-darwin)  OSX_ARCH=x86_64 ;;
            *) echo "unexpected target $TARGET" >&2; exit 2 ;;
          esac
          CLANG=$(find /tmp/osxcross/target/bin -maxdepth 1 -type f \
            -regextype posix-extended \
            -regex ".*/${OSX_ARCH}-apple-darwin[0-9.]+-clang" -print -quit)
          if [ -z "$CLANG" ]; then
            echo "no osxcross clang wrapper for $OSX_ARCH; toolchain contains:" >&2
            ls /tmp/osxcross/target/bin >&2
            exit 2
          fi
          echo "using $CLANG"
          CLANG_NAME=$(basename "$CLANG")
          export CC_aarch64_apple_darwin="$CLANG_NAME"
          export CC_x86_64_apple_darwin="$CLANG_NAME"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$CLANG_NAME"
          export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER="$CLANG_NAME"
          cargo build --locked --release --target "$TARGET" -p minicon

      - name: Verify the produced binary is a real macOS Mach-O
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          PROFILE_DIR=release
          BIN="target/$TARGET/$PROFILE_DIR/minicon"
          file "$BIN"
          file "$BIN" | grep -qi "Mach-O" || { echo "not a Mach-O binary" >&2; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osxcross-probe-${{ inputs.target }}
          path: ${{ format('target/{0}/{1}/minicon', inputs.target, 'release') }}
          retention-days: 7
