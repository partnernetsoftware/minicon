# EXPERIMENTAL — not part of the release or test pipeline.
#
# Answers one narrow question, tracked as `[ ] BLOCKED` in
# prd/PRD_02_27_con_delivery.md ("non-Mac macOS cross-compile from a Linux
# CI/cloud host"): can a Linux runner alone (osxcross + a macOS SDK, no macOS
# runner at all) produce a real macOS Mach-O for MiniCon? This does NOT
# replace six-grid-cloud-build.yml, which already builds the macOS cells
# natively on macos-14/macos-13 runners — that path works today. This
# workflow only tests whether osxcross can additionally remove even that
# native-macOS-runner dependency. Manual trigger only; never runs on push,
# never feeds a Candidate, never gates anything.
name: osxcross experiment (non-Mac macOS cross-compile)

on:
  workflow_dispatch:
    inputs:
      target:
        description: macOS Rust target triple to attempt
        required: true
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        default: aarch64-apple-darwin

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ inputs.target }} via osxcross
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Fetch macOS SDK (alexey-lysiuk/macos-sdk, MacOSX15.5, the newest available)
        run: |
          set -euo pipefail
          # phracker/MacOSX-SDKs tops out at 11.3, whose stub libSystem.tbd is
          # missing symbols agenterm-platform references (run 36018434924:
          # "Undefined symbols for architecture arm64:
          # _proc_signal_with_audittoken"), since osxcross links against the
          # SDK's own stub library, not a real dyld. alexey-lysiuk/macos-sdk
          # publishes one GitHub Release per SDK version up to 15.5 (verified
          # reachable 2026-09-24). Its asset filename drops ".sdk", but the
          # tarball's own top-level directory is already MacOSX15.5.sdk/, so
          # save it under the name osxcross's build.sh globs for
          # (tarballs/MacOSX*.sdk.tar.*).
          curl -fsSL -o /tmp/MacOSX15.5.sdk.tar.xz \
            https://github.com/alexey-lysiuk/macos-sdk/releases/download/15.5/MacOSX15.5.tar.xz

      - name: Build osxcross toolchain
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tpoechtrager/osxcross.git /tmp/osxcross
          cp /tmp/MacOSX15.5.sdk.tar.xz /tmp/osxcross/tarballs/
          cd /tmp/osxcross
          UNATTENDED=1 ./build.sh

      - name: Install Rust target
        run: rustup target add "${{ inputs.target }}"

      - name: Cross-build minicon
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          export PATH="/tmp/osxcross/target/bin:$PATH"
          # osxcross names its wrappers <arch>-apple-darwin<ver>-clang, where
          # <ver> tracks the SDK (darwin20.4 for SDK 11.3). Which string osxcross
          # uses for <arch> on the arm64 side is not stable across its own
          # versions -- run 36013231210 (this same recipe) produced
          # `aarch64-apple-darwin20.4-clang`, not `arm64-apple-darwin20.4-clang`
          # as an earlier run had implied -- so match either. It also ships
          # *-clang++ and *-cmake-clang variants beside the plain wrapper.
          #
          # `find -regextype posix-extended -regex '.*/(aarch64|arm64)-...'`
          # was tried first and failed on this exact runner even though the
          # plain wrapper was confirmed present in the same `ls` the script
          # printed on failure (run 36015677103) -- so the regex path is
          # unreliable here for a reason not yet root-caused. Bash globbing
          # needs no external regex engine and is checked directly against
          # the same directory, so use that instead.
          case "$TARGET" in
            aarch64-apple-darwin) ARCHES="aarch64 arm64" ;;
            x86_64-apple-darwin)  ARCHES="x86_64" ;;
            *) echo "unexpected target $TARGET" >&2; exit 2 ;;
          esac
          CLANG=""
          for arch in $ARCHES; do
            for candidate in /tmp/osxcross/target/bin/"$arch"-apple-darwin*-clang; do
              [ -e "$candidate" ] || continue
              case "$(basename "$candidate")" in
                *-clang++*|*-cmake-clang*) continue ;;
              esac
              CLANG="$candidate"
              break 2
            done
          done
          if [ -z "$CLANG" ]; then
            echo "no osxcross clang wrapper for $ARCHES; toolchain contains:" >&2
            ls /tmp/osxcross/target/bin >&2
            exit 2
          fi
          echo "using $CLANG"
          CLANG_NAME=$(basename "$CLANG")
          export CC_aarch64_apple_darwin="$CLANG_NAME"
          export CC_x86_64_apple_darwin="$CLANG_NAME"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$CLANG_NAME"
          export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER="$CLANG_NAME"
          cargo build --locked --release --target "$TARGET" -p minicon

      - name: Verify the produced binary is a real macOS Mach-O
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          PROFILE_DIR=release
          BIN="target/$TARGET/$PROFILE_DIR/minicon"
          file "$BIN"
          file "$BIN" | grep -qi "Mach-O" || { echo "not a Mach-O binary" >&2; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osxcross-probe-${{ inputs.target }}
          path: ${{ format('target/{0}/{1}/minicon', inputs.target, 'release') }}
          retention-days: 7
