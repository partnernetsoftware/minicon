name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate workflow run ID
        required: true
        type: string
      source_sha:
        description: Exact Candidate source SHA
        required: true
        type: string
      reputation_run_id:
        description: Successful Reputation Qualification workflow run ID
        required: true
        type: string
      version:
        description: Exact Candidate version (for example 0.1.3)
        required: true
        type: string
      confirmation:
        description: publish-vX.Y.Z (or dry-run-publish-vX.Y.Z for dry run)
        required: true
        type: string
      dry_run:
        description: Verify only; create no tag, draft, or public Release
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: minicon-release-promotion
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      include_com: ${{ steps.identity.outputs.include_com }}
    steps:
      - name: Resolve exact successful Candidate
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REPUTATION_RUN_ID: ${{ inputs.reputation_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPUTATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          [[ "$(jq -r .path <<<"$run")" == ".github/workflows/candidate.yml" ]]
          [[ "$(jq -r .event <<<"$run")" == "workflow_dispatch" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$run")" == "$SOURCE_SHA" ]]
          reputation="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPUTATION_RUN_ID")"
          [[ "$(jq -r .path <<<"$reputation")" == ".github/workflows/reputation.yml" ]]
          [[ "$(jq -r .event <<<"$reputation")" == "workflow_dispatch" ]]
          [[ "$(jq -r .status <<<"$reputation")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$reputation")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$reputation")" == "$SOURCE_SHA" ]]
          echo "attempt=$(jq -r .run_attempt <<<"$run")" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download sealed Candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REPUTATION_RUN_ID: ${{ inputs.reputation_run_id }}
        run: |
          set -euo pipefail
          mkdir candidate
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-$CANDIDATE_RUN_ID" --dir candidate
          gh run download "$REPUTATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "reputation-qualification-$REPUTATION_RUN_ID" --dir reputation

      - name: Verify identity, receipt hashes and every sealed byte
        id: identity
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          manifest=candidate/candidate-manifest.json
          test -f "$manifest"
          [[ "$(jq -r .source_sha "$manifest")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .version "$manifest")" == "$VERSION" ]]
          [[ "$(jq -r .expected_tag "$manifest")" == "v$VERSION" ]]
          [[ "$(jq -r .candidate_run.id "$manifest")" == "$CANDIDATE_RUN_ID" ]]
          [[ "$(jq -r .candidate_run.attempt "$manifest")" == '${{ steps.run.outputs.attempt }}' ]]
          [[ "$(sha256sum candidate/build-receipt.json | cut -d' ' -f1)" == \
            "$(jq -r .receipts.build.sha256 "$manifest")" ]]
          [[ "$(sha256sum candidate/aggregate-receipt.json | cut -d' ' -f1)" == \
            "$(jq -r .receipts.aggregate.sha256 "$manifest")" ]]
          [[ "$(sha256sum candidate/g3-receipt.json | cut -d' ' -f1)" == \
            "$(jq -r .receipts.g3.sha256 "$manifest")" ]]
          python3 research/minicon-com-loader/candidate_bundle.py verify \
            --manifest "$manifest" --payload candidate/payload --policy candidate/release-policy.json
          signing_mode="$(jq -r .signing.mode "$manifest")"
          if [[ "$signing_mode" == required ]]; then
            [[ "$(sha256sum candidate/signing-receipt.json | cut -d' ' -f1)" == \
              "$(jq -r .receipts.signing.sha256 "$manifest")" ]]
          else
            [[ "$signing_mode" == off ]]
            test ! -e candidate/signing-receipt.json
          fi
          python3 research/minicon-com-loader/reputation_court.py verify \
            --manifest "$manifest" \
            --qualification reputation/reputation-qualification.json
          cp reputation/reputation-qualification.json candidate/
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          [[ "$cargo_version" == "$VERSION" ]]
          if [[ '${{ inputs.dry_run }}' == true ]]; then
            [[ "$CONFIRMATION" == "dry-run-publish-v$VERSION" || "$CONFIRMATION" == "publish-v$VERSION" ]]
          else
            [[ "$CONFIRMATION" == "publish-v$VERSION" ]]
          fi
          include_com="$(jq -r .release_policy.assets.minicon_com "$manifest")"
          if [[ "$include_com" == true ]]; then
            chmod +x candidate/payload/minicon.com
            [[ "$(candidate/payload/minicon.com --version)" == "minicon $VERSION" ]]
            candidate/payload/minicon.com --status
          fi
          echo "tag=v$VERSION" >>"$GITHUB_OUTPUT"
          echo "include_com=$include_com" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          retention-days: 2

  verify-windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate
      - name: Execute exact Candidate APE on Windows
        if: needs.verify.outputs.include_com == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -LiteralPath candidate/payload/minicon.com -Destination candidate/payload/minicon-ape.exe
          $binary = (Resolve-Path candidate/payload/minicon-ape.exe).Path
          function Invoke-Captured([string[]]$Arguments) {
            $stem = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString("N"))
            $out = "$stem.out"
            $err = "$stem.err"
            $p = Start-Process -FilePath $binary -ArgumentList $Arguments -Wait -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            if ($p.ExitCode -ne 0) { throw "minicon.com exit $($p.ExitCode)" }
            return (Get-Content -LiteralPath $out -Raw)
          }
          if ((Invoke-Captured @('--version')).Trim() -ne 'minicon ${{ inputs.version }}') { throw 'version mismatch' }
          if ((Invoke-Captured @('--status')) -notmatch 'conpty') { throw 'status missing conpty' }

  publish:
    if: ${{ inputs.dry_run != true }}
    needs: [verify, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate
      - name: Reverify and publish exact bytes without rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          python3 research/minicon-com-loader/candidate_bundle.py verify \
            --manifest candidate/candidate-manifest.json --payload candidate/payload \
            --policy candidate/release-policy.json
          [[ "$TAG" == "v$VERSION" ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag already exists; refusing overwrite" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          python3 - "$VERSION" candidate/candidate-manifest.json <<'PY'
          import json, pathlib, sys
          version, manifest_path = sys.argv[1], pathlib.Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text())
          text = pathlib.Path(".github/release-notes.md").read_text().replace("VERSION", version)
          if not manifest["release_policy"]["assets"]["minicon_com"]:
              start, end = "<!-- OPTIONAL_APE_START -->", "<!-- OPTIONAL_APE_END -->"
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              text = before.rstrip() + "\n" + after.lstrip("\n")
          else:
              text = text.replace("<!-- OPTIONAL_APE_START -->\n", "").replace("<!-- OPTIONAL_APE_END -->\n", "")
          pathlib.Path("candidate/release-notes.md").write_text(text)
          PY
          gh release create "$TAG" --draft --target "$SOURCE_SHA" \
            --title "MiniCon $VERSION" --notes-file candidate/release-notes.md \
            candidate/payload/* candidate/*.json
          gh release edit "$TAG" --draft=false

  post-publish-posix:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Download, rehash and execute promoted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir released released/payload
          gh release download "$TAG" --dir released --repo "$GITHUB_REPOSITORY"
          manifest=released/candidate-manifest.json
          test -f "$manifest"
          while IFS= read -r name; do cp "released/$name" "released/payload/$name"; done < <(
            jq -r '.assets[] | .name, .sidecar.name' "$manifest"
          )
          python3 research/minicon-com-loader/candidate_bundle.py verify \
            --manifest "$manifest" --payload released/payload \
            --policy released/release-policy.json
          archive="released/minicon-${{ inputs.version }}-linux-x86_64.tar.gz"
          mkdir released/native
          tar -xzf "$archive" -C released/native
          binary="released/native/minicon-${{ inputs.version }}-linux-x86_64/minicon"
          chmod +x "$binary"
          [[ "$("$binary" --version)" == 'minicon ${{ inputs.version }}' ]]
          "$binary" --status
          if [[ -f released/minicon.com ]]; then
            chmod +x released/minicon.com
            [[ "$(released/minicon.com --version)" == 'minicon ${{ inputs.version }}' ]]
            released/minicon.com --status
          fi

  post-publish-windows:
    needs: [verify, publish]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download, rehash and execute promoted Windows bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path released | Out-Null
          gh release download $env:TAG --dir released --repo $env:GITHUB_REPOSITORY
          $manifest = Get-Content -LiteralPath released/candidate-manifest.json -Raw | ConvertFrom-Json
          $archiveName = 'minicon-${{ inputs.version }}-windows-x86_64.zip'
          $row = $manifest.assets | Where-Object { $_.name -eq $archiveName }
          $archive = Join-Path released $archiveName
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $row.sha256) { throw "promoted Windows archive digest mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath released/native
          $binary = (Resolve-Path 'released/native/minicon-${{ inputs.version }}-windows-x86_64/minicon.exe').Path
          function Invoke-Captured([string[]]$Arguments) {
            $stem = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString("N"))
            $out = "$stem.out"
            $err = "$stem.err"
            $p = Start-Process -FilePath $binary -ArgumentList $Arguments -Wait -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            if ($p.ExitCode -ne 0) { throw "promoted minicon.com exit $($p.ExitCode)" }
            return (Get-Content -LiteralPath $out -Raw)
          }
          if ((Invoke-Captured @('--version')).Trim() -ne 'minicon ${{ inputs.version }}') { throw 'version mismatch' }
          if ((Invoke-Captured @('--status')) -notmatch 'conpty') { throw 'status missing conpty' }
          $com = Join-Path released 'minicon.com'
          if (Test-Path -LiteralPath $com) {
            Copy-Item -LiteralPath $com -Destination released/minicon-ape.exe
            $binary = (Resolve-Path released/minicon-ape.exe).Path
            if ((Invoke-Captured @('--version')).Trim() -ne 'minicon ${{ inputs.version }}') { throw 'APE version mismatch' }
            if ((Invoke-Captured @('--status')) -notmatch 'conpty') { throw 'APE status missing conpty' }
          }
