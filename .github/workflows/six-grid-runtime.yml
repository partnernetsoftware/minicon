name: Six-grid runtime

on:
  workflow_dispatch:
    inputs:
      bundle_ref:
        description: Immutable ghcr.io/OWNER/PACKAGE@sha256:<digest> six-grid index
        required: true
        type: string
      source_sha:
        description: Git source SHA represented by the local cross-build
        required: true
        type: string
      source_tree_sha256:
        description: Local source-tree SHA-256 represented by the test bodies
        required: true
        type: string
      suite:
        description: Runtime depth; no option compiles source
        required: true
        default: test
        type: choice
        options: [status, test, full]
      evidence_probe_cell:
        description: Attempt-one failure probe for receipt-chain qualification only
        required: true
        default: none
        type: choice
        options: [none, lnx-x86_64, lnx-aarch64, win-x86_64, win-aarch64, osx-x86_64, osx-aarch64]

permissions:
  contents: none
  packages: read

concurrency:
  group: six-grid-runtime-${{ inputs.source_tree_sha256 }}
  cancel-in-progress: false

jobs:
  runtime:
    name: ${{ matrix.cell }} / ${{ inputs.suite }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: lnx-x86_64, runner: ubuntu-24.04, family: linux, expected_os: Linux, expected_arch: X64}
          - {cell: lnx-aarch64, runner: ubuntu-24.04-arm, family: linux, expected_os: Linux, expected_arch: ARM64}
          - {cell: win-x86_64, runner: windows-2025, family: windows, expected_os: Windows, expected_arch: X64}
          - {cell: win-aarch64, runner: windows-11-arm, family: windows, expected_os: Windows, expected_arch: ARM64}
          - {cell: osx-x86_64, runner: macos-15-intel, family: macos, expected_os: macOS, expected_arch: X64}
          - {cell: osx-aarch64, runner: macos-15, family: macos, expected_os: macOS, expected_arch: ARM64}
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE_REF: ${{ inputs.bundle_ref }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE_SHA256: ${{ inputs.source_tree_sha256 }}
      CELL: ${{ matrix.cell }}
      FAMILY: ${{ matrix.family }}
      EXPECTED_RUNNER_OS: ${{ matrix.expected_os }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.expected_arch }}
      SUITE: ${{ inputs.suite }}
      EVIDENCE_PROBE_CELL: ${{ inputs.evidence_probe_cell }}
    steps:
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        if: matrix.cell != 'win-aarch64'

      - name: Install verified x64 ORAS on Windows ARM64
        if: matrix.cell == 'win-aarch64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "oras.zip"
          $directory = Join-Path $env:RUNNER_TEMP "oras"
          Invoke-WebRequest -Uri "https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_windows_amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne "b050e93aa0dc7a79a61fa8e4074dfa302c41d4af01b634fe393c5dd687536aee") {
            throw "ORAS archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $directory

      - name: Validate and pull immutable bodies
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir index body payload
          oras pull "$BUNDLE_REF" --output index
          # OCI member names are producer-controlled and space-free; retain Bash 3.2 compatibility on macOS.
          # shellcheck disable=SC2207
          published_matches=($(find index -type f -name 'minicon-six-grid-*-published.json'))
          # shellcheck disable=SC2207
          manifest_matches=($(find index -type f -name 'minicon-six-grid-*-manifest.json'))
          # shellcheck disable=SC2207
          aggregator_matches=($(find index -type f -name 'aggregate-six-grid-runtime.py'))
          test "${#published_matches[@]}" -eq 1 && test "${#manifest_matches[@]}" -eq 1 && test "${#aggregator_matches[@]}" -eq 1
          published="${published_matches[0]}"; build_manifest="${manifest_matches[0]}"
          test "$(jq -r .source_sha "$published")" = "$EXPECTED_SOURCE_SHA"
          test "$(jq -r .source_tree_sha256 "$published")" = "$EXPECTED_TREE_SHA256"
          expected_package="${BUNDLE_REF%@*}"
          test "$(jq -r .package "$published")" = "$expected_package"
          expected_manifest_sha="$(jq -r .build_manifest_sha256 "$published")"
          sha256_file() { python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$1"; }
          test "$(sha256_file "$build_manifest")" = "$expected_manifest_sha"
          test "$(sha256_file "${aggregator_matches[0]}")" = "$(jq -r .runtime_aggregator_sha256 "$published")"
          cp "${aggregator_matches[0]}" runtime-aggregate.py
          cell_ref="$(jq -r --arg cell "$CELL" '.cells[$cell]' "$published")"
          test "${cell_ref%@*}" = "$expected_package"
          [[ "${cell_ref#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          oras pull "$cell_ref" --output body
          # shellcheck disable=SC2207
          asset_matches=($(find body -type f -name "*-$CELL.tar.gz"))
          test "${#asset_matches[@]}" -eq 1
          asset="${asset_matches[0]}"
          expected_asset_sha="$(jq -r --arg cell "$CELL" '.assets[] | select(.cell == $cell) | .sha256' "$build_manifest")"
          test "$(sha256_file "$asset")" = "$expected_asset_sha"
          export ASSET="$asset"
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath
          root = Path("payload")
          with tarfile.open(os.environ["ASSET"], "r:gz") as archive:
              members = archive.getmembers()
              assert len(members) <= 10000
              assert sum(member.size for member in members) <= 4 * 1024**3
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert member.isfile() or member.isdir()
              archive.extractall(root, members=members, filter="data")
          bundle = json.loads((root / "bundle.json").read_text())
          expected = {leaf["path"] for leaf in bundle["files"]} | {"bundle.json"}
          actual = {path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file()}
          assert actual == expected
          for leaf in bundle["files"]:
              path = root / leaf["path"]
              assert path.is_file() and path.stat().st_size == leaf["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == leaf["sha256"]
          PY

      - name: Install Linux runtime libraries
        if: matrix.family == 'linux'
        run: sudo apt-get update && sudo apt-get install -y at-spi2-core dbus-x11 file libxkbcommon-x11-0 xvfb

      - name: Run Linux runtime body
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x payload/linux-runtime-qualify.sh payload/target/debug/minicon payload/target/debug/deps/* payload/target/release-fast/minicon payload/target/release-fast/deps/*
          export MINICON_REPO_ROOT="$PWD/payload/source"
          {
            payload/linux-runtime-qualify.sh payload/target status
            [[ "$SUITE" == status ]] || payload/linux-runtime-qualify.sh payload/target test
            [[ "$SUITE" != full ]] || payload/linux-runtime-qualify.sh payload/target throughput
          } 2>&1 | tee runtime-body.log

      - name: Run macOS runtime body
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x payload/macos-runtime-qualify.sh payload/target/debug/minicon payload/target/debug/deps/* payload/target/release-fast/minicon payload/target/release-fast/deps/*
          {
            payload/macos-runtime-qualify.sh payload/target status
            [[ "$SUITE" == status ]] || payload/macos-runtime-qualify.sh payload/target test
            [[ "$SUITE" != full ]] || payload/macos-runtime-qualify.sh payload/target throughput
          } 2>&1 | tee runtime-body.log

      - name: Run Windows runtime body
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          try {
            & ./payload/windows-runtime-qualify.ps1 -TargetDir ./payload/target -Mode status *>&1 | Tee-Object -FilePath runtime-body.log
            if ($env:SUITE -ne 'status') { & ./payload/windows-runtime-qualify.ps1 -TargetDir ./payload/target -Mode test *>&1 | Tee-Object -FilePath runtime-body.log -Append }
            if ($env:SUITE -eq 'full') { & ./payload/windows-runtime-qualify.ps1 -TargetDir ./payload/target -Mode throughput *>&1 | Tee-Object -FilePath runtime-body.log -Append }
          } catch {
            $_ | Out-String | Tee-Object -FilePath runtime-body.log -Append
            throw
          }

      - name: Inject attempt-one receipt-chain probe
        if: inputs.evidence_probe_cell == matrix.cell && github.run_attempt == 1
        shell: bash
        run: |
          printf 'intentional receipt-chain probe: cell=%s attempt=%s\n' "$CELL" "$GITHUB_RUN_ATTEMPT" | tee -a runtime-body.log
          exit 86

      - name: Write runtime receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          log = Path("runtime-body.log")
          log_bytes = log.stat().st_size if log.is_file() else None
          log_sha = hashlib.sha256(log.read_bytes()).hexdigest() if log.is_file() else None
          Path("runtime-receipt.json").write_text(json.dumps({
              "schema": 2, "cell": os.environ["CELL"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_arch": os.environ["RUNNER_ARCH"], "runner_os": os.environ["RUNNER_OS"],
              "expected_runner_arch": os.environ["EXPECTED_RUNNER_ARCH"],
              "expected_runner_os": os.environ["EXPECTED_RUNNER_OS"],
              "bundle_ref": os.environ["BUNDLE_REF"], "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "source_tree_sha256": os.environ["EXPECTED_TREE_SHA256"], "suite": os.environ["SUITE"],
              "evidence_probe_cell": os.environ["EVIDENCE_PROBE_CELL"],
              "job_status": os.environ["JOB_STATUS"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "runtime_log_bytes": log_bytes, "runtime_log_sha256": log_sha,
          }, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: six-grid-runtime-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: |
            runtime-receipt.json
            runtime-body.log
            runtime-aggregate.py
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate exact six-grid receipt
    if: always()
    needs: runtime
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: none
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: six-grid-runtime-*
          path: receipts

      - name: Aggregate all attempts and require six latest successes
        env:
          BUNDLE_REF: ${{ inputs.bundle_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TREE_SHA256: ${{ inputs.source_tree_sha256 }}
          SUITE: ${{ inputs.suite }}
          EVIDENCE_PROBE_CELL: ${{ inputs.evidence_probe_cell }}
        run: |
          set -euo pipefail
          # Artifact paths are generated from fixed cell/attempt names and contain no spaces.
          # shellcheck disable=SC2207
          aggregators=($(find receipts -type f -name runtime-aggregate.py))
          test "${#aggregators[@]}" -ge 6
          expected_sha=$(sha256sum "${aggregators[0]}" | cut -d' ' -f1)
          for aggregator in "${aggregators[@]}"; do test "$(sha256sum "$aggregator" | cut -d' ' -f1)" = "$expected_sha"; done
          python3 "${aggregators[0]}" --receipts receipts --output six-grid-runtime-receipt.json \
            --bundle-ref "$BUNDLE_REF" --source-sha "$EXPECTED_SOURCE_SHA" \
            --source-tree-sha256 "$EXPECTED_TREE_SHA256" --suite "$SUITE" \
            --evidence-probe-cell "$EVIDENCE_PROBE_CELL"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: six-grid-runtime-aggregate-attempt-${{ github.run_attempt }}
          path: six-grid-runtime-receipt.json
          if-no-files-found: error
          retention-days: 30
