name: windows-native-controls

# Isolated physical input court; operation/evidence owner: PRD 32.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact source SHA; empty uses the dispatched source"
        required: false
        default: ""
      desktop_contrast:
        description: "Diagnostic only: same x64 image on default and allocated desktops"
        type: boolean
        required: false
        default: false
      allocated_first:
        description: "Contrast only: run allocated desktop before Default on the fresh VM"
        type: boolean
        required: false
        default: false
      prepare_arm_default:
        description: "Hosted ARM64 only: bounded verified setup-panel closes, then original court on Default"
        type: boolean
        required: false
        default: false
      preparation_only:
        description: "Diagnostic only: requires prepare_arm_default; ARM64 setup without product build or input"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.preparation_only && '[{"cell":"win-aarch64","runner":"windows-11-arm","triple":"aarch64-pc-windows-msvc"}]' || inputs.desktop_contrast && '[{"cell":"win-x86_64","runner":"windows-2025","triple":"x86_64-pc-windows-msvc"}]' || '[{"cell":"win-x86_64","runner":"windows-2025","triple":"x86_64-pc-windows-msvc"},{"cell":"win-aarch64","runner":"windows-11-arm","triple":"aarch64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate preparation-only selection before setup
        shell: pwsh
        env:
          PREPARATION_ONLY: ${{ inputs.preparation_only }}
          PREPARE_ARM_DEFAULT: ${{ inputs.prepare_arm_default }}
          DESKTOP_CONTRAST: ${{ inputs.desktop_contrast }}
          ALLOCATED_FIRST: ${{ inputs.allocated_first }}
        run: |
          if ($env:PREPARATION_ONLY -eq 'true' -and ($env:PREPARE_ARM_DEFAULT -ne 'true' -or $env:DESKTOP_CONTRAST -eq 'true' -or $env:ALLOCATED_FIRST -eq 'true')) { throw 'preparation_only requires prepare_arm_default and excludes contrast/order options' }
      - name: Ensure the native WebView2 runtime is available
        if: ${{ !inputs.preparation_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue })
          if ($runtime.Count -eq 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Untrusted WebView2 installer' }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(240000)) { $process.Kill(); throw 'WebView2 installation timed out' }
            if ($process.ExitCode -ne 0) { throw 'WebView2 installation failed' }
          }
      - name: Build the default product for this native target
        if: ${{ !inputs.preparation_only }}
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --bin minicon --target $env:TRIPLE
          if ($LASTEXITCODE -ne 0) { throw 'Native product build failed' }
      - name: Run selected preparation or physical controls on the disposable hosted desktop
        shell: pwsh
        env:
          CELL: ${{ matrix.cell }}
          TRIPLE: ${{ matrix.triple }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          DESKTOP_CONTRAST: ${{ inputs.desktop_contrast }}
          ALLOCATED_FIRST: ${{ inputs.allocated_first }}
          PREPARE_ARM_DEFAULT: ${{ inputs.prepare_arm_default }}
          PREPARATION_ONLY: ${{ inputs.preparation_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted court required' }
          if ($env:ALLOCATED_FIRST -eq 'true' -and $env:DESKTOP_CONTRAST -ne 'true') { throw 'allocated_first requires desktop_contrast' }
          if ($env:PREPARE_ARM_DEFAULT -eq 'true' -and $env:DESKTOP_CONTRAST -eq 'true') { throw 'Default preparation cannot be combined with desktop contrast' }
          if ($env:PREPARATION_ONLY -eq 'true' -and ($env:PREPARE_ARM_DEFAULT -ne 'true' -or $env:CELL -ne 'win-aarch64' -or $env:ALLOCATED_FIRST -eq 'true')) { throw 'Invalid preparation-only selection' }
          $output = Join-Path $env:RUNNER_TEMP 'minicon-native-controls'
          if (Test-Path -LiteralPath $output) { throw 'Court output must be fresh' }
          New-Item -ItemType Directory -Path $output | Out-Null
          $originalLanguages = Get-WinUserLanguageList
          $registered = $false
          $restored = $false
          $courtExit = $null
          $preparationOnlyObserved = $false
          try {
            # Pinyin is already installed on these courts. Register its exact
            # profile for this disposable user; never install a language pack.
            $courtLanguages = Get-WinUserLanguageList
            $chinese = @($courtLanguages | Where-Object LanguageTag -eq 'zh-Hans-CN')
            if ($chinese.Count -eq 0) { $courtLanguages.Add('zh-Hans-CN') }
            $chinese = @($courtLanguages | Where-Object LanguageTag -eq 'zh-Hans-CN')
            if ($chinese.Count -ne 1) { throw 'Expected one Simplified Chinese court profile' }
            $chinese[0].InputMethodTips.Clear()
            $chinese[0].InputMethodTips.Add('0804:{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}{FA550B04-5AD7-411F-A5AC-CA038EC515D7}')
            Set-WinUserLanguageList -LanguageList $courtLanguages -Force
            $registered = $true
            $source = (git rev-parse HEAD).Trim()
            $binary = Join-Path $PWD "target/$env:TRIPLE/debug/minicon.exe"
            if ($env:PREPARE_ARM_DEFAULT -eq 'true' -and $env:CELL -eq 'win-aarch64') {
              python -B -X utf8 scripts/native-controls/prepare_default.py --receipt (Join-Path $output 'default-preparation.json') --source-sha $source --close-known-setup-windows
              if ($LASTEXITCODE -ne 0) { throw 'Default desktop preparation refused; inspect its retained receipt' }
              $preparation = Get-Content -Raw -LiteralPath (Join-Path $output 'default-preparation.json') | ConvertFrom-Json
              if ($preparation.source_sha -cne $source -or $preparation.status -cne 'OBSERVED' -or $preparation.default_desktop_verified -ne $true) { throw 'Default preparation identity mismatch' }
              if ($env:RUNNER_ARCH -cne 'ARM64') { throw 'Shell preparation requires the hosted ARM64 cell' }
            }
            if ($env:PREPARATION_ONLY -eq 'true') {
              $preparationOnlyObserved = $true
            } elseif ($env:DESKTOP_CONTRAST -eq 'true') {
              $PSNativeCommandUseErrorActionPreference = $false
              if ($env:CELL -ne 'win-x86_64') { throw 'Desktop contrast requires the x64 court' }
              $imageHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
              $order = $(if ($env:ALLOCATED_FIRST -eq 'true') { @('allocated', 'default') } else { @('default', 'allocated') })
              $exitCodes = @{}
              foreach ($arm in $order) {
                if ($arm -eq 'default') {
                  python -B -X utf8 scripts/native-controls/run.py --binary $binary --output (Join-Path $output 'controls-default') --source-sha $source
                } else {
                  python -B -X utf8 scripts/native-controls/desktop.py --binary $binary --output (Join-Path $output 'controls-allocated') --source-sha $source --desktop-receipt (Join-Path $output 'desktop.json')
                }
                $exitCodes[$arm] = $LASTEXITCODE
                if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() -cne $imageHash) { throw "Contrast image changed after $arm arm" }
              }
              $arms = @(
                foreach ($arm in $order) {
                  $armPath = Join-Path $output "controls-$arm/receipt.json"
                  $armReceipt = Get-Content -Raw -LiteralPath $armPath | ConvertFrom-Json
                  if ($armReceipt.source_sha -cne $source -or $armReceipt.binary_sha256 -cne $imageHash) { throw 'Contrast arm identity mismatch' }
                  [ordered]@{
                    desktop = $arm
                    status = $armReceipt.status
                    phase = $armReceipt.phase
                    reason = $armReceipt.reason
                    process_exit = $exitCodes[$arm]
                    receipt_sha256 = (Get-FileHash -LiteralPath $armPath -Algorithm SHA256).Hash.ToLowerInvariant()
                  }
                }
              )
              [ordered]@{
                kind = 'same-image-desktop-contrast'
                source_sha = $source
                binary_sha256 = $imageHash
                status = 'OBSERVED'
                native_input_qualified = $false
                execution_order = $order
                arms = $arms
              } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'desktop-contrast.json') -Encoding utf8
              $courtExit = $(if ($exitCodes['default'] -eq 0 -and $exitCodes['allocated'] -eq 0) { 0 } else { 1 })
            } elseif ($env:CELL -eq 'win-aarch64' -and $env:PREPARE_ARM_DEFAULT -ne 'true') {
              python -B -X utf8 scripts/native-controls/desktop.py --binary $binary --output (Join-Path $output 'controls') --source-sha $source --desktop-receipt (Join-Path $output 'desktop.json')
              $courtExit = $LASTEXITCODE
            } else {
              python -B -X utf8 scripts/native-controls/run.py --binary $binary --output (Join-Path $output 'controls') --source-sha $source
              $courtExit = $LASTEXITCODE
            }
          } finally {
            try {
              if ($registered) { Set-WinUserLanguageList -LanguageList $originalLanguages -Force }
              $actual = Get-WinUserLanguageList
              $expectedShape = @($originalLanguages | ForEach-Object { $_.LanguageTag + ':' + ($_.InputMethodTips -join ',') }) -join ';'
              $actualShape = @($actual | ForEach-Object { $_.LanguageTag + ':' + ($_.InputMethodTips -join ',') }) -join ';'
              $restored = $expectedShape -ceq $actualShape
            } finally {
              $report = [ordered]@{
                kind = 'isolated-native-input-setup'
                cell = $env:CELL
                source_sha = (git rev-parse HEAD).Trim()
                pinyin_profile_registered = $registered
                language_pack_installed = $false
                original_language_profiles_restored = $restored
                explicit_arm_default_preparation = $env:PREPARE_ARM_DEFAULT -eq 'true' -and $env:CELL -eq 'win-aarch64'
                preparation_only = $env:PREPARATION_ONLY -eq 'true'
                preparation_only_observed = $preparationOnlyObserved
                native_input_qualified = $false
                native_court_exit = $courtExit
              }
              $report | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'setup.json') -Encoding utf8
            }
          }
          if (-not $restored) { throw 'Original language profiles were not restored' }
          if ($env:PREPARATION_ONLY -eq 'true') {
            if (-not $preparationOnlyObserved -or $null -ne $courtExit) { throw 'Preparation-only outcome mismatch' }
            exit 0
          }
          if ($courtExit -ne 0) { throw "Native controls court exited $courtExit; inspect its retained receipt" }
      - name: Upload bounded public observations and owned-window images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-controls-${{ matrix.cell }}
          path: |
            ${{ runner.temp }}/minicon-native-controls/setup.json
            ${{ runner.temp }}/minicon-native-controls/desktop.json
            ${{ runner.temp }}/minicon-native-controls/default-preparation.json
            ${{ runner.temp }}/minicon-native-controls/shell-preparation.json
            ${{ runner.temp }}/minicon-native-controls/desktop-contrast.json
            ${{ runner.temp }}/minicon-native-controls/controls/*.json
            ${{ runner.temp }}/minicon-native-controls/controls/*.png
            ${{ runner.temp }}/minicon-native-controls/controls-default/*.json
            ${{ runner.temp }}/minicon-native-controls/controls-default/*.png
            ${{ runner.temp }}/minicon-native-controls/controls-allocated/*.json
            ${{ runner.temp }}/minicon-native-controls/controls-allocated/*.png
          if-no-files-found: error
          retention-days: 14
