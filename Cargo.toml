[package]
name = "minicon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Lightweight standalone terminal host (PuTTY-style micro terminal)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/minicon"
build = "build.rs"
autobins = false

[[bin]]
name = "minicon"
path = "src/main.rs"

[[test]]
name = "minicon_blackbox"
path = "tests/agenterm_con_blackbox.rs"

[[test]]
name = "minicon_control"
path = "tests/agenterm_con_control.rs"

[[test]]
name = "minicon_alignment"
path = "tests/agenterm_con_alignment.rs"

[[test]]
name = "minicon_throughput"
path = "tests/agenterm_con_throughput.rs"

[[test]]
name = "minicon_accessibility_linux"
path = "tests/agenterm_con_accessibility_linux.rs"

[[test]]
name = "minicon_load_portability"
path = "tests/agenterm_con_load_portability.rs"

[[test]]
name = "minicon_console_agent"
path = "tests/agenterm_con_console_agent.rs"

[dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["clipboard", "filesystem-publish", "filesystem-read", "font", "ime", "ipc", "parent-console", "pty", "runtime", "screenshot", "window"] }
agenterm-ui-core = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", features = ["terminal-selection"] }
itoa = "1"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["input-inject"] }
png = "0.17"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["a11y-tree"] }

[target.'cfg(windows)'.dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["native-pixel-window"] }

# Reads the shipped PE's import table so a static import of an API the
# oldest supported Windows lacks cannot silently return. Same parser as
# agenterm-abi's export gate: pure Rust, no dumpbin on PATH.
[target.'cfg(windows)'.dev-dependencies]
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["runtime"] }

[target.'cfg(unix)'.dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["portable-pixel-window"] }

[target.'cfg(target_os = "linux")'.dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "4c80da07dbd21461199c1aeb16a475e6c76f7444", default-features = false, features = ["a11y-publish"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("default"))'] }