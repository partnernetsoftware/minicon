[workspace]
exclude = ["third_party/vte", "third_party/vt100", "third_party/softbuffer"]
members = [
    "crates/minicon-console",
    "crates/minicon-core",
    "crates/minicon-platform",
    "crates/minicon-ui-core",
    "crates/minicon-web",
]

[package]
name = "minicon"
version = "0.2.21"
edition = "2024"
rust-version = "1.97"
description = "Lightweight standalone terminal host (PuTTY-style micro terminal)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/minicon"
build = "build.rs"
autobins = false

[[bin]]
name = "minicon"
path = "src/main.rs"

[[test]]
name = "minicon_blackbox"
path = "tests/minicon_blackbox.rs"

[[test]]
name = "minicon_control"
path = "tests/minicon_control.rs"

[[test]]
name = "minicon_mux"
path = "tests/minicon_mux.rs"

[[test]]
name = "minicon_alignment"
path = "tests/minicon_alignment.rs"

[[test]]
name = "minicon_throughput"
path = "tests/minicon_throughput.rs"


[[test]]
name = "minicon_load_portability"
path = "tests/minicon_load_portability.rs"

[[test]]
name = "minicon_load_portability_linux"
path = "tests/minicon_load_portability_linux.rs"

[[test]]
name = "minicon_console_agent"
path = "tests/minicon_console_agent.rs"

# These two policy suites test the code-signing inspector and the signing
# workflow by reading the scripts and workflow sources. Like every other test
# target they are listed explicitly; `autobins = false` above turns off only the
# implicit discovery of `src/bin/*` binaries, not of `tests/*`.
[[test]]
name = "authenticode_inspector_policy"
path = "tests/authenticode_inspector_policy.rs"

[[test]]
name = "signing_workflow_policy"
path = "tests/signing_workflow_policy.rs"

[features]
# The owned Rust console is the Windows default backend since 0.2.20, so the
# default build carries it; `--no-default-features` builds the classic-only
# product (its default then falls back to the console agent). The feature name
# keeps its historical spelling so existing build scripts stay valid.
default = ["experimental-rust-console"]
experimental-rust-console = ["minicon-platform/rust-console"]

[dependencies]
minicon-console = { path = "crates/minicon-console" }
minicon-platform = { path = "crates/minicon-platform", default-features = false, features = ["clipboard", "contained-process-spawn", "entropy", "filesystem", "filesystem-read", "font", "host-open", "ime", "input", "ipc", "network-http", "parent-console", "pty", "runtime", "screenshot", "window"] }
minicon-ui-core = { path = "crates/minicon-ui-core", features = ["terminal-selection"] }
itoa = "1"
minicon-core = { path = "crates/minicon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
vt100 = "0.16"
# Inflate for the release archives the updater reads. Already in the graph as
# `png`'s backend (pure-Rust `miniz_oxide`, so cross-builds need no C compiler);
# naming it directly is what lets `src/update_archive.rs` decode a deflated zip
# entry and a gzipped tar member without a general archive crate.
flate2 = "1"
# SHA-256 for the release's own sidecar checksums, so the updater refuses bytes
# that do not match what the release published. `sha2` is already in the graph
# through `minicon-platform`.
sha2 = { version = "0.11", default-features = false }
# PNG encode for a pasted clipboard image. A Windows clipboard screenshot is a
# DIB; writing it as a raw BMP is both huge (the model must read the file) and
# headerless, so `src/clipboard_image.rs` re-encodes it to PNG. `png` is
# already in the graph as the build script's icon decoder.
png = "0.17"

[dev-dependencies]
minicon-platform = { path = "crates/minicon-platform", default-features = false, features = ["input-inject"] }
png = "0.17"


[target.'cfg(windows)'.dependencies]
minicon-platform = { path = "crates/minicon-platform", default-features = false, features = ["native-pixel-window"] }
minicon-web = { path = "crates/minicon-web", features = ["native-page-host"] }

[target.'cfg(target_os = "macos")'.dependencies]
minicon-web = { path = "crates/minicon-web", features = ["native-page-host"] }

# Reads the shipped PE's import table so a static import of an API the
# oldest supported Windows lacks cannot silently return. Same parser as
# agenterm-abi's export gate: pure Rust, no dumpbin on PATH.
[target.'cfg(windows)'.dev-dependencies]
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
minicon-platform = { path = "crates/minicon-platform", default-features = false, features = ["runtime"] }

[target.'cfg(unix)'.dependencies]
minicon-platform = { path = "crates/minicon-platform", default-features = false, features = ["portable-pixel-window"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
minicon-web = { path = "crates/minicon-web" }


[build-dependencies]
# Build scripts compile for the host; target-gating this dependency makes
# macOS/Linux cross-builds lose the Windows resource/link owner.
winresource = "0.1"
# Decodes the committed `assets/minicon.ico` faces into the RGBA the X11 and
# macOS hosts need. Already in the tree as a dev-dependency, so it adds no new
# crate; a build-time decoder keeps it out of the shipped binary.
png = "0.17"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("default"))'] }
# agenterm-con carried `con-dev` / `con-release` / `con-release-fast` for one
# reason: agenterm's workspace profiles are `panic = "abort"`, and native
# callbacks must not unwind across FFI while panics must still be contained.
# A standalone repo has no aborting workspace to escape — Cargo's defaults are
# already unwind — so the indirection is gone and the requirement is stated
# directly here instead of being inherited by accident.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# Fast optimized builds for local iteration; keeps the delivery profile focused
# on size.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Windows delivery profile selected by the 360 QVM decisive court. The compact
# release-fast combination was flagged, while this dev-shaped whole graph with
# size optimization was clean at 1.1 MiB. Keep the explicit shape frozen: it is
# a reputation boundary, not a general replacement for other platforms.
[profile.windows-release]
inherits = "dev"
opt-level = "z"
debug = 2
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
panic = "unwind"
incremental = true
strip = false

# vt100 is not optional: the product needs `take_damage` / `ScreenDamage` /
# `RowRange` / cursor shape+blink / `scrollback_len`, none of which exist
# upstream — line-level VT damage is the render path's whole design.
# softbuffer is vendored so macOS frames carry the display's color space and
# Core Animation presents without a per-frame vImage conversion. Both forks
# now live in this repository under `third_party/`, so MiniCon owns its
# terminal rendering stack instead of tracking an external revision.
[patch.crates-io]
vte = { path = "third_party/vte" }
vt100 = { path = "third_party/vt100" }
softbuffer = { path = "third_party/softbuffer" }
