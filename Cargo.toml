[workspace]
members = ["crates/minicon-core"]

[package]
name = "minicon"
version = "0.1.5"
edition = "2024"
rust-version = "1.97"
description = "Lightweight standalone terminal host (PuTTY-style micro terminal)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/minicon"
build = "build.rs"
autobins = false

[[bin]]
name = "minicon"
path = "src/main.rs"

[[test]]
name = "minicon_blackbox"
path = "tests/minicon_blackbox.rs"

[[test]]
name = "minicon_control"
path = "tests/minicon_control.rs"

[[test]]
name = "minicon_alignment"
path = "tests/minicon_alignment.rs"

[[test]]
name = "minicon_throughput"
path = "tests/minicon_throughput.rs"

[[test]]
name = "minicon_accessibility_linux"
path = "tests/minicon_accessibility_linux.rs"

[[test]]
name = "minicon_load_portability"
path = "tests/minicon_load_portability.rs"

[[test]]
name = "minicon_console_agent"
path = "tests/minicon_console_agent.rs"

[dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["clipboard", "entropy", "filesystem-publish", "filesystem-read", "font", "ime", "ipc", "parent-console", "pty", "runtime", "screenshot", "window"] }
agenterm-ui-core = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", features = ["terminal-selection"] }
itoa = "1"
minicon-core = { path = "crates/minicon-core" }
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["input-inject"] }
png = "0.17"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["a11y-tree"] }

[target.'cfg(windows)'.dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["native-pixel-window"] }

# Reads the shipped PE's import table so a static import of an API the
# oldest supported Windows lacks cannot silently return. Same parser as
# agenterm-abi's export gate: pure Rust, no dumpbin on PATH.
[target.'cfg(windows)'.dev-dependencies]
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["runtime"] }

[target.'cfg(unix)'.dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["portable-pixel-window"] }

[target.'cfg(target_os = "linux")'.dependencies]
agenterm-platform = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3", default-features = false, features = ["a11y-publish"] }

[build-dependencies]
# Build scripts compile for the host; target-gating this dependency makes
# macOS/Linux cross-builds lose the Windows resource/link owner.
winresource = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("default"))'] }
# agenterm-con carried `con-dev` / `con-release` / `con-release-fast` for one
# reason: agenterm's workspace profiles are `panic = "abort"`, and native
# callbacks must not unwind across FFI while panics must still be contained.
# A standalone repo has no aborting workspace to escape — Cargo's defaults are
# already unwind — so the indirection is gone and the requirement is stated
# directly here instead of being inherited by accident.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# Fast optimized builds for local iteration; keeps the delivery profile focused
# on size.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Windows delivery profile selected by the 360 QVM decisive court. The compact
# release-fast combination was flagged, while this dev-shaped whole graph with
# size optimization was clean at 1.1 MiB. Keep the explicit shape frozen: it is
# a reputation boundary, not a general replacement for other platforms.
[profile.windows-release]
inherits = "dev"
opt-level = "z"
debug = 2
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
panic = "unwind"
incremental = true
strip = false

# agenterm-con was built against agenterm's vendored forks, not the crates.io
# releases, and the extraction dropped them. vt100 is not optional: the product
# needs `take_damage` / `ScreenDamage` / `RowRange` / cursor shape+blink /
# `scrollback_len`, none of which exist upstream — line-level VT damage is the
# render path's whole design. softbuffer is vendored so macOS frames carry the
# display's color space and Core Animation presents without a per-frame vImage
# conversion. Both are pinned to the same agenterm revision as the crates
# above, so the fork keeps one source of truth instead of being copied here.
[patch.crates-io]
vt100 = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3" }
softbuffer = { git = "https://github.com/partnernetsoftware/agenterm", rev = "649174e3" }
