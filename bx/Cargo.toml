[package]
name = "bx"
version = "0.1.0"
edition = "2021"
description = "bx - binary scripting for agents"

[[bin]]
name = "bx"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Standalone: bx is its own workspace so MiniCon's workspace stays untouched.
[workspace]
