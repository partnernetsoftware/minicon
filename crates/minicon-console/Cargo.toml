[package]
name = "minicon-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Experimental Rust Windows console service backend for MiniCon PTY consumers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/minicon"

[target.'cfg(windows)'.dependencies]
vt100 = "0.16"
unicode-width = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "minicon-console-probe"
path = "src/bin/minicon-console-probe.rs"
test = false
bench = false

[dev-dependencies]
serde_json = "1"
