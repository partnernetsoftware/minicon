[package]
name = "minicon-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Experimental Rust Windows console service backend for MiniCon PTY consumers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/minicon"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
