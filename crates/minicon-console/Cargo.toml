[package]
name = "minicon-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Reusable terminal state and streaming library with an experimental Rust Windows console service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/minicon"

[dependencies]
# All consumers require the owned screen/grammar APIs even outside this root.
vt100 = { version = "0.16", path = "../../third_party/vt100" }
vte = { version = "0.15", path = "../../third_party/vte", default-features = false }

[target.'cfg(windows)'.dependencies]
unicode-segmentation = "1.13"
unicode-width = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[[bin]]
name = "minicon-console-probe"
path = "src/bin/minicon-console-probe.rs"
test = false
bench = false

[dev-dependencies]
serde_json = "1"
